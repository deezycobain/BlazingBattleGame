name: Analyze Blazing brush glyph sheets

on:
  push:
    branches: [dev-next-2026-09-01]
    paths:
      - .github/workflows/analyze-brush-font.yml
      - assets/fonts/blazing-brush/*.png

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-next-2026-09-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Analyze glyph sheets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          root=Path('assets/fonts/blazing-brush')
          sheets={
            'uppercase':root/'uppercase_alphabet.png',
            'lowercase':root/'lowercase_alphabet.png',
            'numbers':root/'numbers_0_to_9.png',
          }

          def bands(values, gap=2):
              spans=[]; start=None; last=None
              for i,v in enumerate(values):
                  if v:
                      if start is None: start=i
                      last=i
                  elif start is not None and i-last>gap:
                      spans.append([start,last]); start=None; last=None
              if start is not None: spans.append([start,last])
              return spans

          out={}
          for key,path in sheets.items():
              im=Image.open(path).convert('RGBA')
              w,h=im.size
              a=im.getchannel('A')
              bbox=a.getbbox()
              # Occupancy projections at several alpha thresholds, useful for finding intentional cell gaps.
              thresholds={}
              for t in (8,32,96,160):
                  px=a.load()
                  cols=[any(px[x,y]>=t for y in range(h)) for x in range(w)]
                  rows=[any(px[x,y]>=t for x in range(w)) for y in range(h)]
                  thresholds[str(t)]={'columns':bands(cols,3),'rows':bands(rows,3)}
              out[key]={'file':path.name,'width':w,'height':h,'alpha_bbox':bbox,'thresholds':thresholds}
          (root/'sheet-analysis.json').write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/blazing-brush/sheet-analysis.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Analyze Blazing brush glyph sheets"
          git push origin HEAD:dev-next-2026-09-01
