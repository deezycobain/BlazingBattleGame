name: Analyze Blazing brush glyph sheets

on:
  push:
    branches: [dev-next-2026-09-01]
    paths:
      - .github/workflows/analyze-brush-font.yml
      - assets/fonts/blazing-brush/*.png

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-next-2026-09-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Analyze glyph sheets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from collections import Counter
          import json, math

          root=Path('assets/fonts/blazing-brush')
          sheets={
            'uppercase':root/'uppercase_alphabet.png',
            'lowercase':root/'lowercase_alphabet.png',
            'numbers':root/'numbers_0_to_9.png',
          }

          def bands(values, gap=3, min_len=2):
              spans=[]; start=None; last=None
              for i,v in enumerate(values):
                  if v:
                      if start is None: start=i
                      last=i
                  elif start is not None and i-last>gap:
                      if last-start+1>=min_len: spans.append([start,last])
                      start=None; last=None
              if start is not None and last-start+1>=min_len: spans.append([start,last])
              return spans

          out={}
          for key,path in sheets.items():
              im=Image.open(path).convert('RGB')
              w,h=im.size
              pix=im.load()
              # Border median-ish background estimate from most common quantized border color.
              border=[]
              step=max(1,min(w,h)//250)
              for x in range(0,w,step): border.extend([pix[x,0],pix[x,h-1]])
              for y in range(0,h,step): border.extend([pix[0,y],pix[w-1,y]])
              q=lambda c: tuple((v//8)*8 for v in c)
              common=Counter(q(c) for c in border).most_common(8)
              bg=common[0][0]
              analyses={}
              for dist in (20,35,50,70,90):
                  def active(x,y):
                      c=pix[x,y]
                      return math.sqrt(sum((c[i]-bg[i])**2 for i in range(3)))>=dist
                  cols=[any(active(x,y) for y in range(0,h,2)) for x in range(w)]
                  rows=[any(active(x,y) for x in range(0,w,2)) for y in range(h)]
                  analyses[str(dist)]={'columns':bands(cols,5,3),'rows':bands(rows,5,3)}
              # Coarse 8x10 occupancy map to reveal sheet layout without storing image copies.
              grid=[]
              gx,gy=8,10
              for yy in range(gy):
                  row=[]
                  y0=yy*h//gy;y1=(yy+1)*h//gy
                  for xx in range(gx):
                      x0=xx*w//gx;x1=(xx+1)*w//gx
                      total=0;hit=0
                      for y in range(y0,y1,max(1,(y1-y0)//20)):
                          for x in range(x0,x1,max(1,(x1-x0)//20)):
                              total+=1
                              c=pix[x,y]
                              if math.sqrt(sum((c[i]-bg[i])**2 for i in range(3)))>=50: hit+=1
                      row.append(round(hit/max(1,total),3))
                  grid.append(row)
              out[key]={
                'file':path.name,'width':w,'height':h,
                'border_background_rgb':bg,
                'border_common_quantized':[[list(c),n] for c,n in common],
                'contrast_bands':analyses,
                'coarse_occupancy_8x10':grid
              }
          (root/'sheet-analysis.json').write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/blazing-brush/sheet-analysis.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Analyze Blazing brush sheet contrast"
          git push origin HEAD:dev-next-2026-09-01
