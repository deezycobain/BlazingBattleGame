name: Analyze Blazing brush glyph sheets

on:
  push:
    branches: [dev-next-2026-09-01]
    paths:
      - .github/workflows/analyze-brush-font.yml
      - assets/fonts/blazing-brush/*.png

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-next-2026-09-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Analyze glyph sheets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from collections import Counter
          import json, math

          root=Path('assets/fonts/blazing-brush')
          sheets={
            'uppercase':root/'uppercase_alphabet.png',
            'lowercase':root/'lowercase_alphabet.png',
            'numbers':root/'numbers_0_to_9.png',
          }

          def bands(values, gap=3, min_len=2):
              spans=[]; start=None; last=None
              for i,v in enumerate(values):
                  if v:
                      if start is None: start=i
                      last=i
                  elif start is not None and i-last>gap:
                      if last-start+1>=min_len: spans.append([start,last])
                      start=None; last=None
              if start is not None and last-start+1>=min_len: spans.append([start,last])
              return spans

          out={}
          for key,path in sheets.items():
              im=Image.open(path).convert('RGB')
              w,h=im.size; pix=im.load()
              border=[]; step=max(1,min(w,h)//250)
              for x in range(0,w,step): border.extend([pix[x,0],pix[x,h-1]])
              for y in range(0,h,step): border.extend([pix[0,y],pix[w-1,y]])
              q=lambda c: tuple((v//8)*8 for v in c)
              common=Counter(q(c) for c in border).most_common(8); bg=common[0][0]
              def delta(c): return math.sqrt(sum((c[i]-bg[i])**2 for i in range(3)))
              def active(x,y,t=70): return delta(pix[x,y])>=t

              # Main horizontal ink bands.
              row_mask=[any(active(x,y) for x in range(0,w,2)) for y in range(h)]
              main_rows=[r for r in bands(row_mask,12,25) if r[1]-r[0]>=80]
              row_columns=[]
              for y0,y1 in main_rows:
                  # A column counts when it contains enough non-background ink in this row.
                  counts=[]
                  for x in range(w):
                      hit=sum(1 for y in range(y0,y1+1,2) if active(x,y))
                      counts.append(hit)
                  col_mask=[n>=3 for n in counts]
                  cols=bands(col_mask,10,8)
                  row_columns.append({'row':[y0,y1],'columns':cols,'count':len(cols)})

              # Per-row occupancy in 10 equal candidate columns, useful for identifying regular grid cells.
              candidate_grid=[]
              for y0,y1 in main_rows:
                  vals=[]
                  for ci in range(10):
                      x0=ci*w//10; x1=(ci+1)*w//10
                      total=hit=0
                      for y in range(y0,y1+1,max(1,(y1-y0)//35)):
                          for x in range(x0,x1,max(1,(x1-x0)//18)):
                              total+=1; hit+=1 if active(x,y) else 0
                      vals.append(round(hit/max(total,1),3))
                  candidate_grid.append(vals)

              out[key]={
                'file':path.name,'width':w,'height':h,'border_background_rgb':bg,
                'border_common_quantized':[[list(c),n] for c,n in common],
                'main_rows':main_rows,'row_columns':row_columns,
                'row_candidate_10col_occupancy':candidate_grid
              }
          (root/'sheet-analysis.json').write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/blazing-brush/sheet-analysis.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Map Blazing brush glyph sheet rows"
          git push origin HEAD:dev-next-2026-09-01
