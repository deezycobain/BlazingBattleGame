name: Audit Senku Runtime

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/audit-senku-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Run direct Senku battle migration
        run: python dev-tools/migrate_senku_runtime.py

      - name: Commit migrated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dev-tools/direct-migration-run.json
          git commit -m "Apply audited Senku runtime migration" || exit 0
          git push origin HEAD:dev
