name: Audit Senku Runtime

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/audit-senku-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Extract Senku runtime contexts
        shell: python
        run: |
          from pathlib import Path

          src = Path('index.html').read_text(encoding='utf-8').splitlines()
          terms = [
              'Senku', 'senku', 'bomb', 'projectile', 'drawImage',
              'ATTACK_SPRITES', 'impact', 'bossHp', 'BOSS',
              'chakra', 'Chakra', 'jutsu', 'Jutsu', 'special',
              'Revival Formula', 'Ally Heal', 'chemical_reaction',
              'heal', 'Heal', 'turnSpeed', 'speed', 'initiative',
              'meter', 'charge', 'energy'
          ]
          hits = []
          seen = set()

          for i, line in enumerate(src):
              if any(term in line for term in terms):
                  lo = max(0, i - 14)
                  hi = min(len(src), i + 15)
                  key = (lo, hi)
                  if key in seen:
                      continue
                  seen.add(key)
                  hits.append((lo, hi))

          merged = []
          for lo, hi in sorted(hits):
              if not merged or lo > merged[-1][1] + 2:
                  merged.append([lo, hi])
              else:
                  merged[-1][1] = max(merged[-1][1], hi)

          out = []
          out.append('# Senku Runtime Audit\n')
          out.append('Generated from dev/index.html. Line numbers are 1-based. Expanded for chakra, speed, and Ally Heal migration.\n')
          for lo, hi in merged:
              out.append(f'\n## Lines {lo+1}-{hi}\n```html')
              for n in range(lo, hi):
                  out.append(f'{n+1:05d}: {src[n]}')
              out.append('```')

          Path('dev-tools').mkdir(exist_ok=True)
          Path('dev-tools/senku-runtime-audit.md').write_text('\n'.join(out), encoding='utf-8')

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev-tools/senku-runtime-audit.md
          git commit -m "Generate expanded Senku runtime audit" || exit 0
          git push origin HEAD:dev
