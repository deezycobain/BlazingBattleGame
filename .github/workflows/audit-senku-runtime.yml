name: Audit Senku Runtime

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/audit-senku-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Extract small Senku runtime snippets
        shell: python
        run: |
          from pathlib import Path
          import json,re

          text=Path('index.html').read_text(encoding='utf-8')
          # Remove embedded font/image data so searches don't hit encoded junk.
          clean=re.sub(r'data:[^;]+;base64,[A-Za-z0-9+/=]+','<DATA_URL_REMOVED>',text)
          patterns=[
            r'Senku',r'chakra',r'Revival Formula',r'chemical_reaction',r'heal',
            r'ATTACK_SPRITES',r'special',r'speed',r'initiative',r'turn meter',r'Basic builds chakra'
          ]
          items=[];seen=set()
          for pat in patterns:
            for m in re.finditer(pat,clean,re.I):
              lo=max(0,m.start()-700);hi=min(len(clean),m.end()+900)
              snippet=clean[lo:hi].replace('\r','')
              key=snippet[:180]
              if key in seen: continue
              seen.add(key)
              items.append({'term':pat,'offset':m.start(),'snippet':snippet})
              if sum(1 for x in items if x['term']==pat)>=12: break
          Path('dev-tools').mkdir(exist_ok=True)
          Path('dev-tools/senku-runtime-snippets.json').write_text(json.dumps(items,indent=2),encoding='utf-8')

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev-tools/senku-runtime-snippets.json
          git commit -m "Generate Senku runtime snippets" || exit 0
          git push origin HEAD:dev
