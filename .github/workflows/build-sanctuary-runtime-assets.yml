name: Build Sanctuary runtime assets

on:
  push:
    branches:
      - feature/sanctuary-first-bloom
    paths:
      - 'scripts/build-sanctuary-runtime-assets.py'
      - 'scripts/polish-sanctuary-rake-patterns.py'
      - '.github/workflows/build-sanctuary-runtime-assets.yml'
      - 'assets/ui/sanctuary/first-bloom/bonsai/**'
      - 'assets/ui/sanctuary/first-bloom/sand/**'

permissions:
  contents: write

jobs:
  build-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sanctuary branch
        uses: actions/checkout@v4
        with:
          ref: feature/sanctuary-first-bloom
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image build dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless

      - name: Build canonical Sanctuary runtime assets
        run: python scripts/build-sanctuary-runtime-assets.py

      - name: Polish Sanctuary rake grooves
        run: python scripts/polish-sanctuary-rake-patterns.py

      - name: Validate generated runtime asset tree
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/ui/sanctuary/first-bloom/runtime/MANIFEST.json
          test -f assets/ui/sanctuary/first-bloom/runtime/tree/root_contact_shadow.png
          test -f assets/ui/sanctuary/first-bloom/runtime/tree/rootbase_01.png
          test -f assets/ui/sanctuary/first-bloom/runtime/tree/rootfront_04.png
          test -f assets/ui/sanctuary/first-bloom/runtime/tree/trunk_06.png
          test -f assets/ui/sanctuary/first-bloom/runtime/tree/canopy_green_04.png
          test -f assets/ui/sanctuary/first-bloom/runtime/tree/canopy_jade_04.png
          test -f assets/ui/sanctuary/first-bloom/runtime/tree/blossom_pink_03.png
          test -f assets/ui/sanctuary/first-bloom/runtime/tree/fx_pink_bloom_burst.png
          test -f assets/ui/sanctuary/first-bloom/runtime/garden/sand_bed_base.png
          test -f assets/ui/sanctuary/first-bloom/runtime/garden/tray_inner_shade.png
          test -f assets/ui/sanctuary/first-bloom/runtime/garden/pattern_still_water.png
          test -f assets/ui/sanctuary/first-bloom/runtime/garden/pattern_spiral_wind.png
          test -f assets/ui/sanctuary/first-bloom/runtime/garden/motif_blazing_spiral.png
          test -f assets/ui/sanctuary/first-bloom/runtime/garden/stones_centered.png
          echo 'Canonical Sanctuary runtime assets verified.'

      - name: Commit generated runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/ui/sanctuary/first-bloom/runtime
          if git diff --cached --quiet; then
            echo 'No generated runtime asset changes.'
            exit 0
          fi
          git commit -m 'Build canonical Sanctuary runtime assets'
          # Other Sanctuary edits may land while this image job is running.
          # Rebase the generated-only commit onto the latest branch before push.
          git fetch origin feature/sanctuary-first-bloom
          git rebase origin/feature/sanctuary-first-bloom
          git push origin HEAD:feature/sanctuary-first-bloom
