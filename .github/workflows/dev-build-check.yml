name: Runtime build check
on:
  push:
    branches: [main, dev-v2, agent/pass4.1-gameplay-stabilization]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate-pass41d-senku:
    if: >-
      github.actor != 'github-actions[bot]' &&
      ((github.event_name == 'pull_request' && github.head_ref == 'agent/pass4.1-gameplay-stabilization') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/agent/pass4.1-gameplay-stabilization'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass4.1-gameplay-stabilization
      - name: Decode and verify Senku retreat assets
        shell: bash
        run: |
          set -euo pipefail
          bundle=/tmp/pass41c-senku-retreat.tar.gz
          if tar -tzf dev-tools/pass41c-assets.tar.gz >/tmp/direct-list.txt 2>/dev/null; then
            cp dev-tools/pass41c-assets.tar.gz "$bundle"
          else
            cat dev-tools/pass41c-assets/part_*.txt | base64 --decode > "$bundle"
          fi
          tar -tzf "$bundle" | tee /tmp/pass41c-assets.txt
          if grep -Ev '^assets/characters/senku/sprites/' /tmp/pass41c-assets.txt | grep -q .; then
            echo 'Archive contains a path outside Senku sprite assets.' >&2
            exit 1
          fi
          tar -xzf "$bundle"
          expected_source=f459dc179a77f0d174a40cd68c861179b8e95c15
          actual_source=$(git hash-object assets/characters/senku/sprites/source/retreat_run/source_sheet.jpg)
          test "$actual_source" = "$expected_source"
          expected=(
            a7ea447469141e22c7a31d06e6a85061733c3e90
            50e20bbf88d2634eed5df90388493b741e81a2ba
            593e97cd41b87841eeb9b8f4dd3938a720259947
            bacef60923b2fa62d759c54672903bd9c357977b
            a16d8aa19a19d61040353f7827e77c559f7aaec5
            67879c77af64997590d28d8e5268e5aff3905bc1
          )
          for i in 0 1 2 3 4 5; do
            n=$(printf '%02d' $((i+1)))
            file="assets/characters/senku/sprites/runtime/movement/retreat_run/frame_${n}.webp"
            test -s "$file"
            actual=$(git hash-object "$file")
            test "$actual" = "${expected[$i]}"
          done
      - name: Apply guarded Senku pear-range migration
        run: node scripts/pass41d-fix-senku.mjs
      - name: Commit verified Senku retreat repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html runtime/rendering/battlefield-renderer.js assets/characters/senku/sprites/runtime/movement/retreat_run assets/characters/senku/sprites/source/retreat_run
          git diff --cached --quiet || git commit -m "Fix Senku evasive bomb presentation"
          git push
  build:
    if: >-
      !((github.event_name == 'pull_request' && github.head_ref == 'agent/pass4.1-gameplay-stabilization' && github.actor != 'github-actions[bot]') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/agent/pass4.1-gameplay-stabilization' && github.actor != 'github-actions[bot]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
