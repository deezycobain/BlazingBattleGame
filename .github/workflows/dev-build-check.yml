name: Runtime build check
on:
  push:
    branches: [main, dev-v2, dev-next-2026-09-01]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Start built game
        run: |
          npm run serve:dist > /tmp/bb-server.log 2>&1 &
          echo $! > /tmp/bb-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/bb-server.log
          exit 1
      - name: Chromium + WebKit local boot smoke
        run: npm run smoke:browser
      - name: Chromium + WebKit deployed dev smoke
        if: github.event_name == 'push' && github.ref_name == 'dev-next-2026-09-01'
        env:
          BB_SMOKE_URL: https://dev-next-2026-09-01-blazing-battle-game.blazingbattle.workers.dev
          BB_EXPECT_COMMIT: ${{ github.sha }}
        run: |
          for attempt in {1..6}; do
            echo "Deployed smoke attempt $attempt/6"
            if npm run smoke:browser; then exit 0; fi
            sleep 20
          done
          exit 1
