name: Runtime build check
on:
  push:
    branches: [main, dev-v2]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass4.1-gameplay-stabilization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import Asset Inbox Senku melee and retreat frames
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow numpy
          curl -L --fail --retry 3 'https://github.com/user-attachments/assets/ad4c4bc7-f8bd-4791-b679-07038ef655a5' -o /tmp/senku-melee.png
          python - <<'PY'
          from collections import deque
          from pathlib import Path
          import numpy as np
          from PIL import Image

          source = Image.open('/tmp/senku-melee.png').convert('RGB')
          if source.size != (1536, 1024):
              raise SystemExit(f'unexpected source size: {source.size}')

          root = Path('assets/characters/senku/sprites')
          for source_dir in [root/'source'/'melee_attack', root/'source'/'retreat_run']:
              source_dir.mkdir(parents=True, exist_ok=True)
              source.save(source_dir/'source_sheet.webp', 'WEBP', quality=85, method=6)

          rgb = np.asarray(source, dtype=np.uint8)
          period, cell = 128, 512
          blocks = rgb.reshape(1024//period, period, 1536//period, period, 3).transpose(0,2,1,3,4)
          template = np.median(blocks, axis=(0,1)).astype(np.uint8)
          reconstructed = np.tile(template, (1024//period, 1536//period, 1))
          foreground = np.abs(rgb.astype(np.int16)-reconstructed.astype(np.int16)).max(axis=2) > 10
          bboxes = [(80,15,400,460),(25,85,470,490),(25,85,465,490),(70,30,410,510),(45,30,500,510),(45,25,500,510)]

          def largest_component(mask):
              h,w=mask.shape
              data=bytearray(mask.astype(np.uint8).ravel().tolist()); seen=bytearray(h*w); best=[]
              for y in range(h):
                  for x in range(w):
                      i=y*w+x
                      if not data[i] or seen[i]: continue
                      seen[i]=1; q=deque([(x,y)]); comp=[]
                      while q:
                          cx,cy=q.popleft(); comp.append((cx,cy))
                          for dy in (-1,0,1):
                              for dx in (-1,0,1):
                                  if dx==0 and dy==0: continue
                                  nx,ny=cx+dx,cy+dy
                                  if 0<=nx<w and 0<=ny<h:
                                      ii=ny*w+nx
                                      if data[ii] and not seen[ii]:
                                          seen[ii]=1; q.append((nx,ny))
                      if len(comp)>len(best): best=comp
              if not best: raise RuntimeError('no foreground component')
              out=np.zeros((h,w),dtype=np.uint8)
              for x,y in best: out[y,x]=255
              return out

          outputs=[root/'runtime'/'movement'/'retreat_run', root/'runtime'/'attack'/'melee']
          for out in outputs: out.mkdir(parents=True, exist_ok=True)
          for index in range(6):
              row,col=divmod(index,3)
              cell_rgb=rgb[row*cell:(row+1)*cell,col*cell:(col+1)*cell]
              cell_fg=foreground[row*cell:(row+1)*cell,col*cell:(col+1)*cell]
              x0,y0,x1,y1=bboxes[index]
              roi=np.zeros((cell,cell),dtype=np.uint8); roi[y0:y1,x0:x1]=cell_fg[y0:y1,x0:x1].astype(np.uint8)
              mask=largest_component(roi); ys,xs=np.where(mask>0)
              bbox=(int(xs.min()),int(ys.min()),int(xs.max())+1,int(ys.max())+1)
              crop=Image.fromarray(np.dstack((cell_rgb,mask)),'RGBA').crop(bbox)
              cw,ch=crop.size; scale=min(370/cw,382/ch)
              nw,nh=max(1,round(cw*scale)),max(1,round(ch*scale))
              resized=crop.resize((nw,nh),Image.Resampling.LANCZOS)
              canvas=Image.new('RGBA',(420,420),(0,0,0,0)); canvas.alpha_composite(resized,(round(210-nw/2),412-nh))
              if not canvas.getchannel('A').getbbox(): raise RuntimeError(f'empty frame {index+1}')
              for out in outputs: canvas.save(out/f'frame_{index+1:02d}.webp','WEBP',quality=75,method=6)
          PY
          rm -f assets/characters/senku/sprites/source/retreat_run/retreat_run_assets.tar.gz
          rm -f scripts/materialize-senku-retreat-assets.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters/senku/sprites scripts/materialize-senku-retreat-assets.mjs
          if git diff --cached --quiet; then
            echo 'Senku binary assets already materialized.'
            exit 0
          fi
          git commit -m 'Import Senku melee and retreat sprite assets'
          git push origin HEAD:agent/pass4.1-gameplay-stabilization
