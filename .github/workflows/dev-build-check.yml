name: Blazing Battle v0.8.0 build check
on:
  push:
    branches: [main, dev, experimental]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: runtime-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Start built game
        run: |
          env -u RUNNER_TRACKING_ID nohup node scripts/serve-dist.mjs > /tmp/bb-server.log 2>&1 </dev/null &
          server_pid=$!
          echo "$server_pid" > /tmp/bb-server.pid
          for i in {1..30}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Built-game server exited before becoming ready"
              cat /tmp/bb-server.log
              exit 1
            fi
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              sleep 1
              if kill -0 "$server_pid" 2>/dev/null && curl -fsS http://127.0.0.1:4173/ >/dev/null; then
                echo "Built-game server is ready and persistent (pid $server_pid)"
                exit 0
              fi
            fi
            sleep 0.5
          done
          echo "Built-game server did not become stable"
          cat /tmp/bb-server.log
          exit 1
      - name: Chromium + WebKit local paired-team smoke
        run: node scripts/team-pair-browser-smoke.mjs
      - name: Chromium + WebKit local Realm Exploration smoke
        run: npm run smoke:realm
      - name: WebKit mobile deployed Home input smoke
        if: always() && github.event_name == 'push' && github.ref_name == 'dev'
        env:
          BB_SMOKE_URL: https://dev-blazing-battle-game.blazingbattle.workers.dev
          BB_EXPECT_COMMIT: ${{ github.sha }}
          BB_SMOKE_BROWSER: webkit
        run: |
          for attempt in {1..3}; do
            echo "Deployed WebKit Home input smoke attempt $attempt/3"
            if node scripts/browser-smoke-v8.mjs; then exit 0; fi
            sleep 15
          done
          exit 1
      - name: Chromium + WebKit deployed Journey lock and runtime smoke
        if: success() && github.event_name == 'push' && github.ref_name == 'dev'
        env:
          BB_SMOKE_URL: https://dev-blazing-battle-game.blazingbattle.workers.dev
          BB_EXPECT_COMMIT: ${{ github.sha }}
        run: |
          for attempt in {1..6}; do
            echo "Deployed Realm smoke attempt $attempt/6"
            if npm run smoke:realm; then exit 0; fi
            sleep 20
          done
          exit 1
      - name: Chromium + WebKit local boot smoke
        if: always()
        run: npm run smoke:browser
      - name: Chromium + WebKit local Itachi integration smoke
        if: always()
        run: |
          status=0
          node scripts/legendary-itachi-browser-smoke.mjs || status=$?
          node scripts/itachi-battle-browser-smoke.mjs || status=$?
          exit $status
      - name: Save Home browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-browser-screenshots
          path: test-artifacts/*.png
      - name: Chromium + WebKit local results and economy smoke
        run: node scripts/results-browser-smoke.mjs
      - name: Chromium + WebKit local unit progression smoke
        run: node scripts/unit-progression-browser-smoke.mjs
      - name: Chromium + WebKit local player profile smoke
        run: node scripts/player-profile-browser-smoke.mjs
      - name: Chromium + WebKit local Blazing Road persistence smoke
        run: node scripts/road-browser-smoke.mjs
      - name: Chromium + WebKit local Blazing Road gameplay smoke
        run: node scripts/road-gameplay-browser-smoke.mjs
      - name: Chromium + WebKit local battle pause smoke
        run: node scripts/battle-pause-browser-smoke.mjs
      - name: Chromium + WebKit local Retina display-quality smoke
        run: node scripts/display-quality-smoke.mjs
      - name: Chromium + WebKit deployed dev smoke
        if: success() && github.event_name == 'push' && github.ref_name == 'dev'
        env:
          BB_SMOKE_URL: https://dev-blazing-battle-game.blazingbattle.workers.dev
          BB_EXPECT_COMMIT: ${{ github.sha }}
        run: |
          for attempt in {1..6}; do
            echo "Deployed smoke attempt $attempt/6"
            if npm run smoke:browser; then exit 0; fi
            sleep 20
          done
          exit 1
      - name: Chromium + WebKit deployed results and economy smoke
        if: success() && github.event_name == 'push' && github.ref_name == 'dev'
        env:
          BB_SMOKE_URL: https://dev-blazing-battle-game.blazingbattle.workers.dev
