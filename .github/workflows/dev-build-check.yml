name: Runtime build check
on:
  push:
    branches: [main, dev-v2]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 8
        with:
          python-version: '3.12'
      - name: Import Senku Asset Inbox artwork
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 8
        run: |
          python -m pip install --quiet pillow numpy
          curl -L --fail --retry 3 'https://github.com/user-attachments/assets/ad4c4bc7-f8bd-4791-b679-07038ef655a5' -o /tmp/senku-melee.png
          python scripts/import-senku-asset-inbox.py /tmp/senku-melee.png
          git add assets/characters/senku/sprites/source/attack/melee assets/characters/senku/sprites/source/retreat_run/source_sheet.webp assets/characters/senku/sprites/runtime/attack/melee assets/characters/senku/sprites/runtime/movement/retreat_run
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Import Senku Asset Inbox melee and retreat sprites'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: npm install
      - run: npm run build
