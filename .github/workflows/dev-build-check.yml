name: Runtime build check
on:
  push:
    branches: [main, dev-v2]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  pass41-migrate:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && github.head_ref == 'agent/pass4.1-gameplay-stabilization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Normalize basic-dispatch migration anchor
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='scripts/pass41-migrate-shell.mjs';
          let s=fs.readFileSync(p,'utf8');
          const start=s.indexOf("replaceOnce(\n  \"const runBasicAttack=");
          const end=s.indexOf("\nreplaceAfter(\n  'const requestedBasicKind='",start);
          if(start<0||end<0)throw new Error('basic dispatcher migration block not found');
          const block=`const basicSelectionRx=/const runBasicAttack=\\(au\\.name==='Lebee'\\)\\?animateLebeeStarBlast:\\(au\\.name==='Senku'\\?animateSenkuBomb:animateLunge\\);\\s*\\n\\s*const basicTarget=\\(au\\.name==='Lebee'\\|\\|au\\.name==='Senku'\\)\\?enemy:to;/g;
          const basicSelectionMatches=[...html.matchAll(basicSelectionRx)];
          if(basicSelectionMatches.length!==1)throw new Error(\`basic presentation selection: expected 1 match, found \${basicSelectionMatches.length}\`);
          html=html.replace(basicSelectionRx,\`const requestedBasicKind=attackIndex%2===1?'punch':'kick';
              const basicPresentation=window.BlazingAttackPresentation.selectBasicPresentation(canonicalUnit(au.name),from,enemy,requestedBasicKind);
              const runBasicAttack=(au.name==='Lebee')
                ? animateLebeeStarBlast
                : (basicPresentation.runtimeDriver==='animateSenkuBomb'?animateSenkuBomb:animateLunge);
              const basicTarget=(au.name==='Lebee'||basicPresentation.runtimeDriver==='animateSenkuBomb')?enemy:to;\`);
          changes['basic presentation selection']=1;`;
          s=s.slice(0,start)+block+s.slice(end);
          fs.writeFileSync(p,s);
          NODE
      - name: Apply Pass 4.1 shell migration
        run: node scripts/pass41-migrate-shell.mjs
      - name: Commit migrated shell
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html dev-tools/pass41-migration-report.json
          git diff --cached --quiet || git commit -m "Stabilize attack presentation contracts"
          git push
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
