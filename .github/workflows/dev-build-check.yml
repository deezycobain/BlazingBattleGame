name: Runtime build check
on:
  push:
    branches: [main, dev-v2]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  ingest-senku-assets:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check direct Senku assets
        id: assets
        shell: bash
        run: |
          if test -s assets/characters/senku/sprites/runtime/attack/melee/frame_06.webp && test -s assets/characters/senku/sprites/runtime/movement/retreat_run/frame_06.webp; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install image processor
        if: steps.assets.outputs.ready != 'true'
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Fetch Asset Inbox Senku source
        if: steps.assets.outputs.ready != 'true'
        run: |
          curl -L --fail --retry 3 'https://github.com/user-attachments/assets/ad4c4bc7-f8bd-4791-b679-07038ef655a5' -o /tmp/senku-melee.png
          test -s /tmp/senku-melee.png
      - name: Process and commit Senku runtime artwork
        if: steps.assets.outputs.ready != 'true'
        shell: bash
        run: |
          python scripts/process-senku-asset-inbox.py /tmp/senku-melee.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters/senku/sprites/source/attack/melee/source_sheet.webp
          git add assets/characters/senku/sprites/source/retreat_run/source_sheet.webp
          git add assets/characters/senku/sprites/runtime/attack/melee/frame_*.webp
          git add assets/characters/senku/sprites/runtime/movement/retreat_run/frame_*.webp
          git commit -m 'Add Senku melee and retreat animation assets'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
