name: Generate Sanctuary runtime assets

on:
  push:
    branches:
      - sanctuary-rebuild-implementation
    paths:
      - 'scripts/build_sanctuary_runtime_assets.py'
      - '.github/workflows/generate-sanctuary-runtime-assets.yml'

permissions:
  contents: write

jobs:
  generate-runtime-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: sanctuary-rebuild-implementation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install asset tooling
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless

      - name: Build canonical Sanctuary assets
        run: python scripts/build_sanctuary_runtime_assets.py

      - name: Verify canonical canvases
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('assets/ui/sanctuary/first-bloom/runtime')
          required=[
            root/'tree/rootbase_01.png',
            root/'tree/rootfront_04.png',
            root/'tree/trunk_06.png',
            root/'tree/canopy_green_04.png',
            root/'tree/canopy_jade_04.png',
            root/'tree/blossom_pink_03.png',
            root/'garden/sand_bed_base.png',
            root/'garden/pattern_still_water.png',
            root/'garden/pattern_spiral_wind.png',
            root/'garden/motif_akatsuki_cloud.png',
            root/'garden/stones_centered.png',
            root/'garden/stones_riverbank.png',
            root/'garden/stones_mountain.png',
            root/'MANIFEST.json',
          ]
          for p in required:
            assert p.exists(), p
          for p in (root/'tree').glob('*.png'):
            assert Image.open(p).size == (1536,1536), (p,Image.open(p).size)
          for p in (root/'garden').glob('*.png'):
            assert Image.open(p).size == (1536,1024), (p,Image.open(p).size)
          print('Sanctuary canonical runtime asset verification PASS')
          PY

      - name: Commit generated runtime assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ui/sanctuary/first-bloom/runtime
          if git diff --cached --quiet; then
            echo 'No runtime asset changes to commit.'
            exit 0
          fi
          git commit -m 'Generate canonical Sanctuary runtime assets'
          git push origin HEAD:sanctuary-rebuild-implementation
