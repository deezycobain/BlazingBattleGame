name: Import Home UI Asset Bundle

on:
  push:
    branches:
      - dev-next-2026-09-01
    paths:
      - home-ui-import.zip
      - blazing-battle-home-ui-approved-assets.zip

permissions:
  contents: write

jobs:
  import-home-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: dev-next-2026-09-01
          fetch-depth: 0

      - name: Locate and unpack bundle
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""
          for candidate in home-ui-import.zip blazing-battle-home-ui-approved-assets.zip; do
            if [[ -f "$candidate" ]]; then
              ZIP="$candidate"
              break
            fi
          done

          if [[ -z "$ZIP" ]]; then
            echo "No supported Home UI ZIP found at repository root."
            exit 1
          fi

          rm -rf .home-ui-import
          mkdir -p .home-ui-import
          unzip -q "$ZIP" -d .home-ui-import

          SRC=".home-ui-import/assets/ui/home"
          if [[ ! -d "$SRC" ]]; then
            echo "Expected assets/ui/home inside $ZIP."
            find .home-ui-import -maxdepth 5 -type f -print || true
            exit 1
          fi

          FILE_COUNT=$(find "$SRC" -type f | wc -l | tr -d ' ')
          WEBP_COUNT=$(find "$SRC" -type f -name '*.webp' | wc -l | tr -d ' ')

          if [[ "$FILE_COUNT" -ne 34 || "$WEBP_COUNT" -ne 32 ]]; then
            echo "Unexpected bundle contents: $FILE_COUNT total files, $WEBP_COUNT WebPs. Expected 34 and 32."
            exit 1
          fi

          rm -rf assets/ui/home
          mkdir -p assets/ui
          cp -a "$SRC" assets/ui/home

          rm -rf .home-ui-import
          rm -f "$ZIP"

      - name: Commit approved Home UI assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/ui/home home-ui-import.zip blazing-battle-home-ui-approved-assets.zip || true

          if git diff --cached --quiet; then
            echo "No Home UI asset changes to commit."
            exit 0
          fi

          git commit -m "Import approved Home UI assets"
          git push origin HEAD:dev-next-2026-09-01
