name: Inject Senku Runtime Into Dev

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/inject-senku-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Inject runtime module before game initialization
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="./runtime/senku-basic-runtime-patch.js"></script>'

          if tag in html:
              print('Senku runtime module already linked; no change needed.')
          else:
              marker = '</head>'
              if marker not in html:
                  raise SystemExit('Could not find </head> in index.html')
              html = html.replace(marker, f'  {tag}\n{marker}', 1)
              path.write_text(html, encoding='utf-8')
              print('Injected Senku runtime module into index.html')

      - name: Commit integration
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate approved Senku basic runtime into dev game"
          git push origin HEAD:dev

# One-shot integration helper for the current Senku checkpoint.
