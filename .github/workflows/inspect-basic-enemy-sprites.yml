name: Inspect basic enemy sprites

on:
  push:
    branches:
      - dev-next-2026-09-01
    paths:
      - blazing-battle-basic-enemy-sprites-v1.zip
      - .github/workflows/inspect-basic-enemy-sprites.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev-next-2026-09-01

      - name: Inspect battle sprite loader
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(errors='replace')
          markers=['function drawUnit(','ACTIVE_ENEMY_SPRITES','const SPRITES','const SPRITE','SPRITE_MAP','UNIT_IMAGES','new Image();','function animateLunge(']
          seen=[]
          for marker in markers:
              start=0
              while True:
                  i=text.find(marker,start)
                  if i<0: break
                  if all(abs(i-old)>1800 for old in seen):
                      seen.append(i)
                      lo=max(0,i-2600); hi=min(len(text),i+7000)
                      print(f'\n--- {marker} @ {i} ---\n{text[lo:hi]}\n--- END ---')
                  start=i+len(marker)
                  if len(seen)>=16: break
              if len(seen)>=16: break
          print(f'SPRITE_SNIPPETS={len(seen)}')
          PY
