name: Validate basic enemy integration

on:
  push:
    branches:
      - dev-next-2026-09-01
    paths:
      - .github/workflows/inspect-basic-enemy-sprites.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev-next-2026-09-01

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate basic enemy content
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-blazing-road-content.mjs
          node --check runtime/modes/basic-enemy-sprites.js
          node --check runtime/modes/blazing-road-content.js
          node --check scripts/blazing-road-postprocess.mjs
          test ! -f blazing-battle-basic-enemy-sprites-v1.zip
          test "$(find assets/sprites/enemies -mindepth 2 -maxdepth 2 -type f -name '*.png' | wc -l)" -eq 12

      - name: Full production build
        run: npm run build
