name: Inspect bomb renderer
on:
  push:
    branches: [dev-v2]
    paths-ignore:
      - 'dev-tools/bomb-render-scan.txt'
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract bomb renderer
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const needle="else if(f.kind==='senkuBombProjectile')";
          const i=html.indexOf(needle);
          if(i<0) throw new Error('renderer not found');
          fs.mkdirSync('dev-tools',{recursive:true});
          fs.writeFileSync('dev-tools/bomb-render-scan.txt',html.slice(i,i+6000));
          NODE
      - name: Commit scan
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dev-tools/bomb-render-scan.txt
          git diff --cached --quiet || git commit -m "Record bomb renderer inspection"
          git push