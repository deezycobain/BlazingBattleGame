name: Inspect full Scorpion renderer seam

on:
  push:
    branches: [experiment/scorpion-puppet-atlas]
    paths:
      - ".github/workflows/inspect-full-scorpion-renderer.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/scorpion-puppet-atlas
          fetch-depth: 0
      - name: Print full drawUnit implementation
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const i=html.indexOf('function drawUnit(x,y,label,color,active=false,visual=null,name=null,isEnemy=false,flipX=1,sizeScale=1){');
          const end=html.indexOf('\nfunction render()',i);
          console.log('DRAW_UNIT_START'); console.log(html.slice(i,end)); console.log('DRAW_UNIT_END');
          NODE
      - name: Remove one-shot inspector
        run: |
          git rm .github/workflows/inspect-full-scorpion-renderer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove full Scorpion renderer inspector"
          git pull --rebase origin experiment/scorpion-puppet-atlas
          git push origin HEAD:experiment/scorpion-puppet-atlas
