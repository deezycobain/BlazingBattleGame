name: Inspect team UI source

on:
  push:
    branches: [dev-v2]
    paths-ignore:
      - 'dev-tools/team-ui-scan.txt'

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract team UI source contexts
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const needles=['Save Team','SAVE TEAM','save team','Team saved','TEAM SAVED','team saved','Crimson','Senku','localStorage','savedTeam','selectedTeam','teamSlots','defaultTeam','playerTeam'];
          let out='';
          for(const needle of needles){
            out+='\n===== '+needle+' =====\n';
            let from=0,count=0;
            while(count<25){
              const i=html.indexOf(needle,from);
              if(i<0) break;
              out+=`\n--- match ${count+1} @ ${i} ---\n`+html.slice(Math.max(0,i-600),Math.min(html.length,i+needle.length+900))+'\n';
              from=i+needle.length;count++;
            }
          }
          fs.mkdirSync('dev-tools',{recursive:true});
          fs.writeFileSync('dev-tools/team-ui-scan.txt',out);
          NODE
      - name: Commit inspection result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dev-tools/team-ui-scan.txt
          git diff --cached --quiet || git commit -m "Record team UI source inspection"
          git push
