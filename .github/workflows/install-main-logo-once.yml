name: Install approved main logo once

on:
  push:
    branches: [dev-next-2026-09-01]
    paths:
      - '.github/workflows/install-main-logo-once.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-next-2026-09-01

      - name: Install canonical logo assets and runtime
        shell: bash
        run: |
          set -euo pipefail
          ZIP='blazing-battle-main-logo-approved.zip'
          test -f "$ZIP"
          rm -rf /tmp/bb-logo
          mkdir -p /tmp/bb-logo
          unzip -q "$ZIP" -d /tmp/bb-logo

          test -f /tmp/bb-logo/assets/ui/home/branding/blazing-battle-logo.webp
          test -f /tmp/bb-logo/_design_references/branding/blazing-battle-logo-master-4k.png

          mkdir -p assets/ui/home/branding _design_references/branding runtime/ui/home
          cp /tmp/bb-logo/assets/ui/home/branding/blazing-battle-logo.webp assets/ui/home/branding/blazing-battle-logo.webp
          cp /tmp/bb-logo/_design_references/branding/blazing-battle-logo-master-4k.png _design_references/branding/blazing-battle-logo-master-4k.png

          cat > runtime/ui/home/home-logo-runtime.js <<'JS'
          (()=>{
          'use strict';
          const SHELL_ID='bbHomeApproved';
          const STYLE_ID='bb-main-logo-style';
          const SLOT_CLASS='bb-main-logo-slot';
          const LOGO='assets/ui/home/branding/blazing-battle-logo.webp';

          function ensureStyle(){
            if(document.getElementById(STYLE_ID))return;
            const style=document.createElement('style');
            style.id=STYLE_ID;
            style.textContent=`
          #${SHELL_ID} .bb-home-v4-brand,
          #menuScreen.bb-home-theme .bb-home-title,
          #menuScreen.bb-home-theme .bb-home-kicker{display:none!important}
          #${SHELL_ID} .${SLOT_CLASS}{
            position:absolute;z-index:9;left:50%;top:clamp(64px,9.5vh,92px);
            width:min(68vw,620px);height:min(31vh,285px);transform:translateX(-50%);
            display:grid;place-items:center;pointer-events:none;isolation:isolate;
            filter:drop-shadow(0 13px 18px rgba(0,0,0,.34));
          }
          #${SHELL_ID} .${SLOT_CLASS}:before{
            content:'';position:absolute;z-index:-1;left:50%;top:50%;width:116%;height:86%;
            transform:translate(-50%,-50%) rotate(-1deg);
            background:radial-gradient(ellipse at center,rgba(235,218,177,.90) 0 34%,rgba(225,202,157,.66) 49%,rgba(42,28,28,.22) 66%,transparent 76%);
            filter:blur(10px);opacity:.93;pointer-events:none;
          }
          #${SHELL_ID} .${SLOT_CLASS} img{
            display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;
            image-rendering:auto;-webkit-user-drag:none;user-select:none;
          }
          @media(max-width:620px){
            #${SHELL_ID} .${SLOT_CLASS}{top:max(62px,calc(env(safe-area-inset-top) + 55px));width:min(76vw,390px);height:min(24vh,190px)}
            #${SHELL_ID} .${SLOT_CLASS}:before{width:122%;height:92%}
          }
          @media(max-height:700px){
            #${SHELL_ID} .${SLOT_CLASS}{top:max(57px,calc(env(safe-area-inset-top) + 50px));height:min(22vh,165px);width:min(62vw,470px)}
          }
          `;
            document.head.appendChild(style);
          }

          function install(){
            ensureStyle();
            const shell=document.getElementById(SHELL_ID);
            if(!shell)return false;
            let slot=shell.querySelector('.'+SLOT_CLASS);
            if(!slot){
              slot=document.createElement('div');
              slot.className=SLOT_CLASS;
              slot.setAttribute('aria-label','Blazing Battle');
              slot.innerHTML=`<img src="${LOGO}" alt="Blazing Battle" draggable="false">`;
              shell.appendChild(slot);
            }
            const img=slot.querySelector('img');
            if(img&&img.getAttribute('src')!==LOGO)img.setAttribute('src',LOGO);
            shell.dataset.bbMainLogo='approved-scroll';
            return true;
          }

          let queued=false;
          const queue=()=>{
            if(queued)return;
            queued=true;
            requestAnimationFrame(()=>{queued=false;install();});
          };
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',queue,{once:true});
          else queue();
          const observer=new MutationObserver(queue);
          observer.observe(document.documentElement,{childList:true,subtree:true});
          window.BlazingMainLogo={install,asset:LOGO};
          })();
          JS

          python3 - <<'PY'
          from pathlib import Path
          import json

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          tag = '<script src="runtime/ui/home/home-logo-runtime.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('index.html missing </body>')
              text = text.replace(marker, tag + '\n' + marker, 1)
              index.write_text(text, encoding='utf-8')

          manifest_path = Path('assets/ui/home/ASSET_MANIFEST.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          canonical = 'assets/ui/home/branding/blazing-battle-logo.webp'
          manifest['assets'] = [a for a in manifest.get('assets', []) if a.get('path') != canonical]
          manifest['assets'].append({
              'path': canonical,
              'source': 'blazing-battle-logo-master-4k.png',
              'width': 4096,
              'height': 2260,
              'bytes': Path(canonical).stat().st_size
          })
          notes = manifest.setdefault('notes', {})
          notes['branding_status'] = 'Approved ninja-scroll Blazing Battle logo. Runtime loads only branding/blazing-battle-logo.webp; 4K PNG master is archival.'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

          rm -f "$ZIP"

          # Guard against accidental additional runtime logo assets.
          mapfile -t runtime_logos < <(find assets runtime -type f \( -iname '*logo*.png' -o -iname '*logo*.webp' -o -iname '*logo*.jpg' -o -iname '*logo*.jpeg' \) 2>/dev/null | sort)
          printf 'Runtime/logo-named files after install:\n%s\n' "${runtime_logos[*]:-none}"
          test -f assets/ui/home/branding/blazing-battle-logo.webp
          test ! -f blazing-battle-main-logo-approved.zip
          grep -q 'runtime/ui/home/home-logo-runtime.js' index.html

      - name: Commit logo integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui/home/branding _design_references/branding runtime/ui/home/home-logo-runtime.js assets/ui/home/ASSET_MANIFEST.json index.html
          git add -u blazing-battle-main-logo-approved.zip
          git diff --cached --quiet && exit 0
          git commit -m "Install approved Blazing Battle main logo"
          git push origin HEAD:dev-next-2026-09-01
