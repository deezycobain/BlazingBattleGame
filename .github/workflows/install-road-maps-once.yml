name: Install Road maps once
on:
  push:
    branches: [dev-next-2026-09-01]
    paths:
      - '.github/workflows/install-road-maps-once.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-next-2026-09-01
      - name: Download approved Road maps from shared Drive
        run: |
          set -euo pipefail
          mkdir -p assets/maps/blazing-road
          download(){
            local id="$1" out="$2"
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              -o "assets/maps/blazing-road/${out}"
          }
          download '1aA1hK-TGnd1ivXFT45nT_mYPKCtPxe7D' 'stage-01-south-sac.webp'
          download '1Jny6UL70TtY0N5YvJL3bs-9al8qZfmuc' 'stage-02-moon-statue-garden.webp'
          download '13Mx0WResFHhsBSGkQ79c_6Y0eIf6SgKZ' 'stage-03-lantern-garden.webp'
          download '1S77dyW8cd2cy-R9poAFnhfDELPTkREcM' 'stage-04-shinobi-overlook.webp'
          download '1VoWvKgeaiusBaKE1TgPIQ_NPFN1SzT-O' 'stage-05-training-grounds.webp'
      - name: Verify exact approved bytes
        run: |
          cd assets/maps/blazing-road
          cat > /tmp/road-map-sha256.txt <<'EOF'
          79a371452bb0762f223ecf06032d68450a7cea0bdc58fb576bcfaaa5bd511e7e  stage-01-south-sac.webp
          fb6aadd112e243746614949994c296bd2a90dd4fa2ebd57baa0505db2ed3e083  stage-02-moon-statue-garden.webp
          5ef9607f9d2a69dde50af2813b2032e932cc8562232d189974ba7ade0d0d11fc  stage-03-lantern-garden.webp
          293a78d5f0968c5e73895310810199e28aa2f974dbe57aa128345fcb80293403  stage-04-shinobi-overlook.webp
          1da41ec6eac6c81a029e21e1c79f17ef440b7b7a7ffd7adcdad3629347d4ec2c  stage-05-training-grounds.webp
          EOF
          sha256sum -c /tmp/road-map-sha256.txt
          file *.webp
      - name: Commit binary map assets and remove installer
        run: |
          set -euo pipefail
          rm .github/workflows/install-road-maps-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/maps/blazing-road .github/workflows/install-road-maps-once.yml
          git commit -m "Install approved Blazing Road map assets"
          git push origin HEAD:dev-next-2026-09-01
