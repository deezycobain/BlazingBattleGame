name: Itachi playtest build
on:
  push:
    branches: [feature/legendary-itachi-playtest]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Build and inspect Itachi runtime
        run: npm run build
