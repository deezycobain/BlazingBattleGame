name: Legacy Shinobi Targeted Smoke

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/legacy-shinobi-smoke.yml"
      - "scripts/legacy-shinobi-browser-smoke.mjs"
      - "scripts/legacy-shinobi-postprocess.mjs"
      - "scripts/validate-legacy-shinobi.mjs"
      - "tools/unpack_legacy_shinobi.py"
      - "assets/characters/kakashi/**"
      - "assets/characters/obito/**"
      - "assets/characters/jiraiya/**"
      - "assets/characters/sasuke/**"
      - "assets/characters/pain/**"
      - "assets/characters/scorpion/**"
      - "assets/characters/rock_lee/**"
      - "assets/characters/mashle/**"
      - "assets/characters/jackie_chan/**"
      - "assets/characters/gabimaru/**"
      - "assets/characters/killua/**"
      - "assets/characters/zabuza/**"
  workflow_dispatch:

jobs:
  legacy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Build audited Legacy runtime
        run: npm run build
      - name: Inspect Legacy attack runtime
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('dist/index.html','utf8');
          for(const needle of ['function animateLunge','function unitAttackFrames','attackPose','function drawUnit','function renderUnit']){
            const i=s.indexOf(needle);
            console.log('\n===== '+needle+' @ '+i+' =====');
            if(i>=0) console.log(s.slice(Math.max(0,i-1800),Math.min(s.length,i+7000)));
          }
          NODE
      - name: Start local build
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/legacy-server.log 2>&1 &
          echo $! > /tmp/legacy-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/legacy-server.log
          exit 1
      - name: Run focused Legacy browser smoke
        env:
          BB_SMOKE_URL: http://127.0.0.1:4173
        run: node scripts/legacy-shinobi-browser-smoke.mjs
      - name: Audit Itachi basic frame alpha bounds
        run: |
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            const report=await page.evaluate(async()=>{
              const frames=globalThis.eval("unitAttackFrames('Itachi','basic_attack')");
              for(let i=0;i<50;i++){
                if(frames.length===6&&frames.every(img=>img.complete&&img.naturalWidth>0&&img.naturalHeight>0))break;
                await new Promise(r=>setTimeout(r,100));
              }
              return frames.map((img,index)=>{
                const w=img.naturalWidth,h=img.naturalHeight,canvas=document.createElement('canvas');
                canvas.width=w;canvas.height=h;
                const ctx=canvas.getContext('2d',{willReadFrequently:true});
                ctx.drawImage(img,0,0);
                const data=ctx.getImageData(0,0,w,h).data;
                let minX=w,minY=h,maxX=-1,maxY=-1,count=0;
                for(let p=0;p<data.length;p+=4){
                  if(data[p+3]<=8)continue;
                  count++;
                  const n=p/4,x=n%w,y=Math.floor(n/w);
                  if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;
                }
                const empty=maxX<0;
                return {frame:index+1,w,h,count,bbox:empty?null:{minX,minY,maxX,maxY,width:maxX-minX+1,height:maxY-minY+1},margins:empty?null:{left:minX,right:w-1-maxX,top:minY,bottom:h-1-maxY},cropRisk:!empty&&(minX<4||w-1-maxX<4||minY<4)};
              });
            });
            console.log('ITACHI_BASIC_ALPHA_BOUNDS='+JSON.stringify(report));
            if(report.some(frame=>frame.cropRisk)){
              console.error('Itachi authored basic frame touches a top/side canvas edge; asset-level clipping is present.');
              process.exitCode=2;
            }
          }finally{await browser.close()}
          NODE
