name: Pass 2 shell extraction
on:
  push:
    branches: [agent/pass2-runtime-extraction]
    paths-ignore:
      - 'dev-tools/pass2-shell-scan.txt'
      - 'dev-tools/pass2-extraction-report.json'
      - 'assets/characters/lebee/vfx/basic/star_blast/projectile/**'
      - 'assets/characters/lebee/vfx/jutsu/meteor/**'
      - 'assets/characters/subzero/sprites/runtime/jutsu/freeze_blast/cast/**'
      - 'assets/characters/subzero/sprites/runtime/recoil/**'
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Extract approved shell-owned assets byte-for-byte
        run: node scripts/pass2-extract-shell-assets.mjs
      - name: Commit extracted assets and report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/characters/lebee/vfx/basic/star_blast/projectile assets/characters/lebee/vfx/jutsu/meteor assets/characters/subzero/sprites/runtime/jutsu/freeze_blast/cast assets/characters/subzero/sprites/runtime/recoil dev-tools/pass2-extraction-report.json
          git diff --cached --quiet || git commit -m "Extract Pass 2 shell-owned runtime assets"
          git push
