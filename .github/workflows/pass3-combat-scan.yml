name: Pass 3 combat migration
on:
  push:
    branches: [agent/pass3-combat-runtime]
    paths-ignore:
      - 'dev-tools/pass3-combat-scan.txt'
      - 'dev-tools/pass3-migration-report.json'
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Capture combat mutation neighborhoods
        run: |
          node <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('index.html','utf8');
          const html=raw.replace(/data:image\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+/=]+/g,'<DATA_URI>');
          const patterns=[
            ['HP mutations', /\b[\w.()\[\]'"-]+\.hp\s*(?:\+=|-=|=)\s*[^;\n]+/g],
            ['Gauge mutations', /\b[\w.()\[\]'"-]+\.gauge\s*(?:\+=|-=|=)\s*[^;\n]+/g],
            ['Chakra mutations', /\b[\w.()\[\]'"-]+\.chakra\s*(?:\+=|-=|=)\s*[^;\n]+/g]
          ];
          let out='';
          for(const [label,rx] of patterns){out+=`\n===== ${label} =====\n`;let count=0;for(const m of html.matchAll(rx)){if(count++>=80)break;const i=m.index;out+=`\n--- ${count} @ ${i} ---\nMATCH: ${m[0]}\n${html.slice(Math.max(0,i-1100),Math.min(html.length,i+m[0].length+1700))}\n`;}}
          fs.mkdirSync('dev-tools',{recursive:true});
          fs.writeFileSync('dev-tools/pass3-combat-scan.txt',out);
          NODE
      - name: Migrate combat mutations
        run: node scripts/pass3-migrate-combat.mjs
      - name: Commit migrated combat shell
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html scripts/build-cloudflare.mjs dev-tools/pass3-combat-scan.txt dev-tools/pass3-migration-report.json
          git diff --cached --quiet || git commit -m "Delegate shell combat mutations to runtime"
          git push
