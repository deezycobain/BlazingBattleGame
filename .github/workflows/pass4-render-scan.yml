name: Pass 4 rendering migration
on:
  push:
    branches: [agent/pass4-rendering-runtime]
    paths-ignore:
      - 'dev-tools/pass4-migration-report.json'
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Bound Pass 4 to stable renderer seams
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='scripts/pass4-migrate-rendering.mjs';
          let s=fs.readFileSync(p,'utf8');
          const frameA=s.indexOf("replaceText(\n`  // Start every frame from a known-good canvas state.");
          const targetA=s.indexOf("\n\nreplaceRx(\n  /    \\/\\/ Target feedback",frameA);
          const healA=s.indexOf("\n\nreplaceRx(\n  /    if\\(showAllyHealTargets",targetA);
          const enemyA=s.indexOf("\n\nreplaceText(\n`    ctx.save();",healA);
          const uiA=s.indexOf("\n\nreplaceRx(\n  /function updateTacticalTicker",enemyA);
          if(frameA<0||targetA<0||healA<0||enemyA<0||uiA<0)throw new Error('temporary migration seam boundary missing');
          s=s.slice(0,frameA)+"replacements['frame reset and Jutsu dim delegation']='deferred';"+s.slice(targetA);
          let a=s.indexOf("\n\nreplaceRx(\n  /    \\/\\/ Target feedback");
          let b=s.indexOf("\n\nreplaceRx(\n  /    if\\(showAllyHealTargets",a);
          s=s.slice(0,a)+"\n\nreplacements['target bubble delegation']='deferred';"+s.slice(b);
          a=s.indexOf("\n\nreplaceRx(\n  /    if\\(showAllyHealTargets");
          b=s.indexOf("\n\nreplaceText(\n`    ctx.save();",a);
          s=s.slice(0,a)+"\n\nreplacements['ally heal target delegation']='deferred';"+s.slice(b);
          a=s.indexOf("\n\nreplaceText(\n`    ctx.save();");
          b=s.indexOf("\n\nreplaceRx(\n  /function updateTacticalTicker",a);
          s=s.slice(0,a)+"\n\nreplacements['enemy health bar delegation']='deferred';"+s.slice(b);
          for(const marker of ['drawTargetBubble','drawAllyHealTarget','drawEnemyHealthBar']){
            s=s.replace(`  'window.BlazingBattlefieldRenderer.${marker}',\n`,'');
          }
          fs.writeFileSync(p,s);
          NODE
      - name: Migrate rendering shell
        run: node scripts/pass4-migrate-rendering.mjs
      - name: Commit migrated shell
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html dev-tools/pass4-migration-report.json
          git diff --cached --quiet || git commit -m "Delegate stable battlefield rendering seams to runtime"
          git push
