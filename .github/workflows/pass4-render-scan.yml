name: Pass 4 rendering migration
on:
  push:
    branches: [agent/pass4-rendering-runtime]
    paths-ignore:
      - 'dev-tools/pass4-migration-report.json'
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Migrate rendering shell
        run: node scripts/pass4-migrate-rendering.mjs
      - name: Commit migrated shell
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html dev-tools/pass4-migration-report.json
          git diff --cached --quiet || git commit -m "Delegate battlefield rendering to runtime"
          git push
