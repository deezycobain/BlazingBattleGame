name: Pass 4.1 gameplay scan
on:
  push:
    branches: [agent/pass4.1-gameplay-stabilization]
    paths-ignore:
      - 'dev-tools/pass41-gameplay-audit.txt'
      - 'dev-tools/pass41-animation-contract.txt'
      - 'dev-tools/pass41-baseline-compare.txt'
      - 'dev-tools/pass41-targeted-contract.txt'
permissions:
  contents: write
jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass4.1-gameplay-stabilization
          fetch-depth: 1
      - name: Fetch solid gameplay checkpoint
        run: git fetch origin checkpoint/v0.7.0-solid-2026-07-28:refs/remotes/origin/pass41-solid --depth=1
      - name: Scan gameplay seams
        run: |
          node scripts/pass41-scan-shell.mjs
          node scripts/pass41-compare-baseline.mjs
      - name: Commit audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dev-tools/pass41-gameplay-audit.txt dev-tools/pass41-animation-contract.txt dev-tools/pass41-baseline-compare.txt dev-tools/pass41-targeted-contract.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Record Pass 4.1 gameplay audit"
          git push
