name: Pass 4.1 gameplay migration
on:
  push:
    branches: [agent/pass4.1-gameplay-stabilization]
    paths-ignore:
      - 'dev-tools/pass41-migration-report.json'
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass4.1-gameplay-stabilization
      - name: Apply stabilization migration
        run: node scripts/pass41-migrate-shell.mjs
      - name: Commit migrated shell
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html dev-tools/pass41-migration-report.json
          git diff --cached --quiet || git commit -m "Stabilize attack presentation contracts"
          git push
