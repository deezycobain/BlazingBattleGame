name: Pass 4.1c Senku retreat migration
on:
  push:
    branches: [agent/pass4.1-gameplay-stabilization]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass4.1-gameplay-stabilization
      - run: node scripts/pass41c-migrate-shell.mjs
      - name: Commit migrated shell
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Wire Senku evasive bomb retreat"
          git push
