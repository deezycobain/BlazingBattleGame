name: Pass 4.1d Senku pear migration
on:
  push:
    branches: [agent/pass4.1-gameplay-stabilization]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass4.1-gameplay-stabilization
      - name: Apply guarded Senku pear-range migration
        run: node scripts/pass41d-fix-senku.mjs
      - name: Commit migrated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html runtime/rendering/battlefield-renderer.js
          git diff --cached --quiet || git commit -m "Fix Senku pear range geometry"
          git push
