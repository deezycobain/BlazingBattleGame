name: Road AI anchor probe once
on:
  push:
    branches: [dev-next-2026-09-01]
    paths:
      - '.github/workflows/probe-road-ai-once.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe legacy speed and enemy AI anchors
        run: node scripts/probe-road-ai.mjs
