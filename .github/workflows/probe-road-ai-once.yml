name: Road AI anchor probe once
on:
  push:
    branches: [dev-next-2026-09-01]
    paths:
      - '.github/workflows/probe-road-ai-once.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build shell through Home finalizer
        run: |
          node scripts/build-cloudflare.mjs
          node scripts/postprocess-build.mjs
          node scripts/tyler-playable-postprocess.mjs
          node scripts/ui-polish-postprocess.mjs
          node scripts/postprocess-senku-retreat-cleanup.mjs
          node scripts/static-hitbox-postprocess.mjs
          node scripts/combat-polish-postprocess.mjs
          node scripts/strict-attack-facing-postprocess.mjs
          node scripts/subzero-freeze-alignment-postprocess.mjs
          node scripts/ui-runtime-finalize.mjs
          node scripts/progression-postprocess.mjs
          node scripts/team-editor-route-postprocess.mjs
          node scripts/browser-mouse-input-postprocess.mjs
          node scripts/loading-screen-postprocess.mjs
          node scripts/home-grid-finalize.mjs
      - name: Probe postprocessed Road turn watchdog
        run: node scripts/probe-road-ai.mjs
