name: Scorpion Puppet Preview

on:
  push:
    branches:
      - experiment/scorpion-puppet-atlas
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: scorpion-puppet-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout atlas experiment
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build experiment
        run: npm run build

      - name: Start built game
        run: |
          env -u RUNNER_TRACKING_ID nohup node scripts/serve-dist.mjs > /tmp/bb-server.log 2>&1 </dev/null &
          server_pid=$!
          echo "$server_pid" > /tmp/bb-server.pid
          for i in {1..30}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/bb-server.log
              exit 1
            fi
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/bb-server.log
          exit 1

      - name: Capture V2 articulation gate
        run: node scripts/scorpion-puppet-v2-browser-gate.mjs

      - name: Publish V2 articulation gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorpion-puppet-v2-articulation-gate
          path: |
            docs/validation/puppet-atlas-v2/
            assets/characters/scorpion/puppet/v2/source/scorpion_puppet_v2_master.png
            assets/characters/scorpion/puppet/v2/body/scorpion_puppet_body_atlas_v2.json
            assets/characters/scorpion/puppet/v2/body/scorpion_puppet_neutral_reference_v2.json
            assets/characters/scorpion/data/puppet-atlas-v2.json
          retention-days: 7

      - name: Start temporary phone test tunnel
        run: |
          env -u RUNNER_TRACKING_ID nohup npx wrangler tunnel quick-start http://127.0.0.1:4173 > /tmp/scorpion-tunnel.log 2>&1 </dev/null &
          tunnel_pid=$!
          echo "$tunnel_pid" > /tmp/scorpion-tunnel.pid
          url=""
          for i in {1..60}; do
            if ! kill -0 "$tunnel_pid" 2>/dev/null; then
              echo "Quick Tunnel exited before producing a URL"
              cat /tmp/scorpion-tunnel.log
              exit 1
            fi
            url=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/scorpion-tunnel.log | tail -1 || true)
            if [ -n "$url" ]; then
              break
            fi
            sleep 1
          done
          if [ -z "$url" ]; then
            echo "Quick Tunnel did not produce a URL"
            cat /tmp/scorpion-tunnel.log
            exit 1
          fi
          printf '%s\n' "$url" | tee /tmp/scorpion-preview-url.txt
          echo "## Scorpion Puppet Phone Test" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "Temporary Quick Tunnel for experiment/scorpion-puppet-atlas at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish live preview commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(cat /tmp/scorpion-preview-url.txt)
          payload=$(jq -nc --arg state success --arg target_url "$url" --arg description "20-minute Scorpion Puppet V2 phone preview" --arg context "scorpion-puppet-preview/live" '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl -fsS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"

      - name: Publish temporary URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorpion-puppet-live-url
          path: /tmp/scorpion-preview-url.txt
          retention-days: 1

      - name: Keep phone test alive for 20 minutes
        run: |
          echo "Temporary phone test is live."
          sleep 1200
