name: Scorpion Puppet Preview

on:
  push:
    branches:
      - experiment/scorpion-puppet-atlas
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorpion-puppet-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout atlas experiment
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Build experiment
        run: npm run build

      - name: Start built game
        run: |
          env -u RUNNER_TRACKING_ID nohup node scripts/serve-dist.mjs > /tmp/bb-server.log 2>&1 </dev/null &
          server_pid=$!
          echo "$server_pid" > /tmp/bb-server.pid
          for i in {1..30}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/bb-server.log
              exit 1
            fi
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/bb-server.log
          exit 1

      - name: Validate Scorpion puppet in Chromium and WebKit
        run: node scripts/scorpion-puppet-atlas-browser-smoke.mjs

      - name: Upload non-production Cloudflare version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets."
            exit 20
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not configured in GitHub Actions secrets."
            exit 21
          fi
          npx wrangler versions upload 2>&1 | tee /tmp/scorpion-preview.txt
          echo "## Scorpion Puppet Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: experiment/scorpion-puppet-atlas" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/scorpion-preview.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
