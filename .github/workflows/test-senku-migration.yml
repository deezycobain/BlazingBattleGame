name: Test Senku Migration Patterns

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/test-senku-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Test exact migration anchors
        shell: python
        run: |
          from pathlib import Path
          import re,json
          html=Path('index.html').read_text(encoding='utf-8')
          checks={}
          checks['unit_data_tag']=bool(re.search(r'(<script id="blazing-unit-data">window\.BLAZING_UNIT_DATA=)(\{.*?\})(;</script>)',html,re.S))
          checks['runtime_chakra_anchor']="maxChakra:d.combat.chakra_max||0,jutsuCost:jutsu.cost??99," in html
          checks['make_roster_anchor']="const start=opts.startingChakra??2;\n u.chakra=start==='full'?u.maxChakra:Math.max(0,Math.min(u.maxChakra,start));" in html
          checks['team_spawn']=bool(re.search(r"function teamSpawnOptions\(name\)\{.*?\n\}",html,re.S))
          checks['speed_anchor']="mark:d.combat.mark,speed:d.stats.speed,attack:d.stats.attack,defense:d.stats.defense," in html
          checks['boss_speed_anchor']="speed:canonicalUnit('anubis').stats.speed,attack:canonicalUnit('anubis').stats.attack" in html
          checks['animation_function']=bool(re.search(r'function animateSenkuChemicalReaction\(unitName,from,target,onImpact,onDone\)\{.*?\n\}\n\nfunction animateSenkuBomb',html,re.S))
          checks['renderer_block']=bool(re.search(r"else if\(f\.kind==='senkuChemProjectile'\)\{.*?else if\(f\.kind==='senkuBombProjectile'\)\{",html,re.S))
          checks['heal_anchor']="const healed=Math.max(0,ally.maxHp-ally.hp);\n     ally.hp=ally.maxHp;" in html
          checks['hud_anchor']="Basic builds chakra; closer linked allies can amplify Link Attack buffs." in html
          m=re.search(r'(<script id="blazing-unit-data">window\.BLAZING_UNIT_DATA=)(\{.*?\})(;</script>)',html,re.S)
          if m:
            try:
              data=json.loads(m.group(2)); checks['embedded_json_parse']=True;checks['embedded_senku']=data.get('senku',{})
            except Exception as e: checks['embedded_json_parse']=str(e)
          Path('dev-tools/direct-migration-status.json').write_text(json.dumps(checks,indent=2),encoding='utf-8')
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev-tools/direct-migration-status.json
          git commit -m "Record Senku direct migration diagnostics" || exit 0
          git push origin HEAD:dev
