name: Unpack Legacy of Shinobi

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/unpack-legacy-shinobi.yml"
      - "tools/unpack_legacy_shinobi.py"
      - "legacy_of_the_shinobi_banner_pack_v1_under25.zip"
      - "legacy_of_the_shinobi_banner_pack_v2.zip"
      - "legacy_of_the_shinobi_banner_pack_v3_clean_cards.zip"
      - "legacy_of_the_shinobi_jackie_chan_refresh.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Install asset-prep dependency
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Extract and prepare Legacy of Shinobi
        run: python3 tools/unpack_legacy_shinobi.py

      - name: Commit extracted and runtime-ready assets
        run: |
          PATHS=(
            assets/events/legacy-of-shinobi
            assets/characters/kakashi
            assets/characters/obito
            assets/characters/jiraiya
            assets/characters/sasuke
            assets/characters/pain
            assets/characters/scorpion
            assets/characters/rock_lee
            assets/characters/mashle
            assets/characters/jackie_chan
            assets/characters/killua
            assets/characters/zabuza
            assets/characters/gabimaru
            runtime/registry/unit-index.json
          )
          if git diff --quiet -- "${PATHS[@]}" && [ -z "$(git status --porcelain -- "${PATHS[@]}")" ]; then
            echo "No prepared asset changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${PATHS[@]}"
          git commit -m "Prepare Legacy of Shinobi runtime assets"
          git pull --rebase origin dev
          git push origin HEAD:dev
