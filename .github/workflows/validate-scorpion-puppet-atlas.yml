name: Validate Scorpion Puppet Atlas V1

on:
  push:
    branches: [experiment/scorpion-puppet-atlas]
    paths:
      - ".github/workflows/validate-scorpion-puppet-atlas.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/scorpion-puppet-atlas
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Start built game
        run: |
          env -u RUNNER_TRACKING_ID nohup node scripts/serve-dist.mjs > /tmp/bb-scorpion-puppet-server.log 2>&1 </dev/null &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep .5
          done
          cat /tmp/bb-scorpion-puppet-server.log
          exit 1
      - run: node scripts/scorpion-puppet-atlas-browser-smoke.mjs
      - name: Commit validation screenshots
        run: |
          set -euo pipefail
          git rm .github/workflows/validate-scorpion-puppet-atlas.yml
          git add docs/validation/scorpion-puppet-atlas-v1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Scorpion Puppet Atlas V1 validation screenshots"
          git pull --rebase origin experiment/scorpion-puppet-atlas
          git push origin HEAD:experiment/scorpion-puppet-atlas
