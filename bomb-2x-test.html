<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Blazing Battle — Senku Bomb 2x Test</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #game { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="game" src="./index.html" title="Blazing Battle"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('game');
      const SCALE = 2;

      function looksLikeSenkuBomb(image) {
        if (!image) return false;
        const src = String(image.currentSrc || image.src || '');
        if (src.includes('/senku/') && src.includes('bomb')) return true;
        if (src.includes('projectile_clean')) return true;

        // The current cleaned Senku bomb runtime frames are 96x96 PNGs.
        // This fallback catches the live renderer even if it has converted the
        // image to an internal canvas/image object and stripped the source URL.
        const w = image.naturalWidth || image.videoWidth || image.width || 0;
        const h = image.naturalHeight || image.videoHeight || image.height || 0;
        return w === 96 && h === 96;
      }

      function wrapDrawImage(target, original) {
        if (!target || typeof original !== 'function' || original.__senkuBomb2xWrapped) return original;

        function patchedDrawImage(image, ...args) {
          if (!looksLikeSenkuBomb(image)) return original.call(this, image, ...args);

          if (args.length === 2) {
            const [dx, dy] = args;
            const ow = image.naturalWidth || image.width || 0;
            const oh = image.naturalHeight || image.height || 0;
            const nw = ow * SCALE;
            const nh = oh * SCALE;
            return original.call(this, image, dx - (nw - ow) / 2, dy - (nh - oh) / 2, nw, nh);
          }

          if (args.length === 4) {
            const [dx, dy, dw, dh] = args;
            const nw = dw * SCALE;
            const nh = dh * SCALE;
            return original.call(this, image, dx - (nw - dw) / 2, dy - (nh - dh) / 2, nw, nh);
          }

          if (args.length === 8) {
            const [sx, sy, sw, sh, dx, dy, dw, dh] = args;
            const nw = dw * SCALE;
            const nh = dh * SCALE;
            return original.call(this, image, sx, sy, sw, sh,
              dx - (nw - dw) / 2,
              dy - (nh - dh) / 2,
              nw,
              nh
            );
          }

          return original.call(this, image, ...args);
        }

        patchedDrawImage.__senkuBomb2xWrapped = true;
        return patchedDrawImage;
      }

      function installPatch() {
        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        if (!win || !doc) return;

        // Patch the prototype for future contexts.
        if (win.CanvasRenderingContext2D) {
          const proto = win.CanvasRenderingContext2D.prototype;
          if (!proto.__senkuBomb2xPatched) {
            proto.drawImage = wrapDrawImage(proto, proto.drawImage);
            proto.__senkuBomb2xPatched = true;
          }
        }

        // Patch contexts that may already have been created by the game before
        // this wrapper gets control.
        doc.querySelectorAll('canvas').forEach(canvas => {
          try {
            const ctx = canvas.getContext('2d');
            if (ctx && !ctx.__senkuBomb2xPatched) {
              ctx.drawImage = wrapDrawImage(ctx, ctx.drawImage);
              ctx.__senkuBomb2xPatched = true;
            }
          } catch (_) {}
        });
      }

      frame.addEventListener('load', () => {
        installPatch();
        // Keep re-checking briefly because the game can create/replace canvases
        // after initial load.
        [50, 150, 300, 600, 1000, 2000, 4000].forEach(ms => setTimeout(installPatch, ms));
      });
    })();
  </script>
</body>
</html>
