<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Blazing Battle — Senku Basic Attack Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#game{display:block;width:100%;height:100%;border:0}
#status{position:fixed;z-index:999999;top:8px;right:8px;padding:5px 8px;border-radius:8px;font:700 11px/1.2 system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.72);pointer-events:none}
</style>
</head>
<body>
<div id="status">SENKU TEST LOADING…</div>
<iframe id="game" title="Blazing Battle"></iframe>
<script>
(() => {
  const frame=document.getElementById('game');
  const status=document.getElementById('status');
  const injectedPatch=String.raw`
<script>
(() => {
  const BOMB_SCALE=2;
  const EXPLOSION_FRAME_MS=75;
  const EXPLOSION_WIDTH=132;
  const EXPLOSION_HEIGHT=73;
  const BASE='https://raw.githubusercontent.com/deezycobain/BlazingBattleGame/dev/assets/characters/senku/vfx/bomb/small_explosion_6f/';
  const EXPLOSION_FRAMES=[1,2,3,4,5,6].map(n=>BASE+'frame_0'+n+'.png');
  const preloaded=EXPLOSION_FRAMES.map(src=>{const i=new Image();i.src=src;return i;});
  let bombHits=0, explosionCount=0, lastBombDraw=null, impactTimer=null;

  function report(){try{parent.postMessage({type:'senku-dev-status',bombHits,explosionCount},'*')}catch(_){}}
  function looksLikeBomb(image){
    if(!image)return false;
    const src=String(image.currentSrc||image.src||'');
    if(src.includes('projectile_clean'))return true;
    if(src.includes('/senku/')&&src.includes('/bomb/')&&!src.includes('small_explosion_6f'))return true;
    const w=image.naturalWidth||image.videoWidth||image.width||0;
    const h=image.naturalHeight||image.videoHeight||image.height||0;
    return w===96&&h===96;
  }
  function getDest(args,image){
    if(args.length===2){const[dx,dy]=args;return{dx,dy,dw:image.naturalWidth||image.width||0,dh:image.naturalHeight||image.height||0}}
    if(args.length===4){const[dx,dy,dw,dh]=args;return{dx,dy,dw,dh}}
    if(args.length===8){const[sx,sy,sw,sh,dx,dy,dw,dh]=args;return{dx,dy,dw,dh}}
    return null;
  }
  function playExplosion(canvas,dest){
    if(!canvas||!dest)return;
    explosionCount++;report();
    const rect=canvas.getBoundingClientRect();
    const sx=rect.width/canvas.width, sy=rect.height/canvas.height;
    const impactX=rect.left+(dest.dx+dest.dw/2)*sx;
    const impactY=rect.top+(dest.dy+dest.dh)*sy;
    const img=document.createElement('img');
    img.style.cssText='position:fixed;z-index:2147483646;pointer-events:none;object-fit:contain;transform:translate(-50%,-100%);transform-origin:50% 100%;';
    img.style.left=impactX+'px';img.style.top=impactY+'px';img.style.width=EXPLOSION_WIDTH+'px';img.style.height=EXPLOSION_HEIGHT+'px';
    document.body.appendChild(img);
    let f=0;
    function step(){if(f>=preloaded.length){img.remove();return}img.src=preloaded[f].src;f++;setTimeout(step,EXPLOSION_FRAME_MS)}
    step();
  }

  if(window.CanvasRenderingContext2D){
    const proto=CanvasRenderingContext2D.prototype;
    const original=proto.drawImage;
    proto.drawImage=function(image,...args){
      if(!looksLikeBomb(image))return original.call(this,image,...args);
      const dest=getDest(args,image);
      if(dest){
        lastBombDraw={canvas:this.canvas,dest};
        if(impactTimer)clearTimeout(impactTimer);
        impactTimer=setTimeout(()=>{if(lastBombDraw)playExplosion(lastBombDraw.canvas,lastBombDraw.dest);lastBombDraw=null},95);
      }
      bombHits++;report();
      if(args.length===2){const[dx,dy]=args,ow=image.naturalWidth||image.width||0,oh=image.naturalHeight||image.height||0,nw=ow*BOMB_SCALE,nh=oh*BOMB_SCALE;return original.call(this,image,dx-(nw-ow)/2,dy-(nh-oh)/2,nw,nh)}
      if(args.length===4){const[dx,dy,dw,dh]=args,nw=dw*BOMB_SCALE,nh=dh*BOMB_SCALE;return original.call(this,image,dx-(nw-dw)/2,dy-(nh-dh)/2,nw,nh)}
      if(args.length===8){const[sx,sy,sw,sh,dx,dy,dw,dh]=args,nw=dw*BOMB_SCALE,nh=dh*BOMB_SCALE;return original.call(this,image,sx,sy,sw,sh,dx-(nw-dw)/2,dy-(nh-dh)/2,nw,nh)}
      return original.call(this,image,...args);
    };
  }
  report();
})();
<\/script>`;

  window.addEventListener('message',e=>{
    if(!e.data||e.data.type!=='senku-dev-status')return;
    status.textContent=`SENKU TEST • BOMB 2× • EXPLOSIONS ${e.data.explosionCount}`;
  });

  fetch('./index.html',{cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
    .then(html=>{
      const baseTag='<base href="./">';
      let patched=html;
      if(patched.includes('<head>'))patched=patched.replace('<head>','<head>'+baseTag+injectedPatch);
      else patched=baseTag+injectedPatch+patched;
      frame.srcdoc=patched;
      status.textContent='SENKU TEST • BOMB 2× • EXPLOSIONS 0';
    })
    .catch(err=>{console.error(err);status.textContent='SENKU TEST LOAD ERROR'});
})();
</script>
</body>
</html>
