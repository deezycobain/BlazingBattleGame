<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Blazing Battle — Stable Test Loader</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    #game{display:block;width:100%;height:100%;border:0;background:#000}
    #status{position:fixed;z-index:999999;top:8px;right:8px;padding:5px 8px;border-radius:8px;font:700 11px/1.2 system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.72);pointer-events:none}
  </style>
</head>
<body>
  <div id="status">LOADING GAME…</div>
  <iframe id="game" src="./index.html?v=stable-loader-1" title="Blazing Battle"></iframe>
  <script>
    const frame=document.getElementById('game');
    const status=document.getElementById('status');
    frame.addEventListener('load',()=>{status.textContent='GAME LOADED';setTimeout(()=>status.remove(),1800)});
    frame.addEventListener('error',()=>{status.textContent='GAME LOAD ERROR'});
  </script>
</body>
</html>
