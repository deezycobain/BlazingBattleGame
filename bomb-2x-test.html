<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Blazing Battle — Senku Bomb 2x Test</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #game { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="game" src="./index.html" title="Blazing Battle"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('game');
      const projectilePath = 'assets/characters/senku/vfx/bomb/projectile_clean/';

      function installPatch() {
        const doc = frame.contentDocument;
        if (!doc || !doc.head) return;

        const style = doc.createElement('style');
        style.id = 'senku-bomb-2x-test-patch';
        style.textContent = `
          img[src*="${projectilePath}"],
          img[src*="vfx/bomb/projectile_clean/"] {
            scale: 2 !important;
            transform-origin: center center !important;
          }
        `;
        doc.head.appendChild(style);
      }

      frame.addEventListener('load', installPatch);
    })();
  </script>
</body>
</html>
