<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Blazing Battle — Senku Bomb 2x Test</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #game { display: block; width: 100%; height: 100%; border: 0; }
    #status {
      position: fixed;
      z-index: 999999;
      top: 8px;
      right: 8px;
      padding: 5px 8px;
      border-radius: 8px;
      font: 700 11px/1.2 system-ui, sans-serif;
      color: #fff;
      background: rgba(0,0,0,.72);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="status">2× BOMB TEST LOADING…</div>
  <iframe id="game" title="Blazing Battle"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('game');
      const status = document.getElementById('status');

      const injectedPatch = String.raw`
<script>
(() => {
  const SCALE = 2;
  let hitCount = 0;

  function report() {
    try {
      parent.postMessage({ type: 'senku-bomb-test-hit', hitCount }, '*');
    } catch (_) {}
  }

  function looksLikeBomb(image) {
    if (!image) return false;
    const src = String(image.currentSrc || image.src || '');
    if (src.includes('projectile_clean')) return true;
    if (src.includes('/senku/') && src.includes('/bomb/')) return true;

    const w = image.naturalWidth || image.videoWidth || image.width || 0;
    const h = image.naturalHeight || image.videoHeight || image.height || 0;
    return w === 96 && h === 96;
  }

  if (window.CanvasRenderingContext2D) {
    const proto = CanvasRenderingContext2D.prototype;
    const original = proto.drawImage;

    proto.drawImage = function(image, ...args) {
      if (!looksLikeBomb(image)) return original.call(this, image, ...args);

      hitCount++;
      report();

      if (args.length === 2) {
        const [dx, dy] = args;
        const ow = image.naturalWidth || image.width || 0;
        const oh = image.naturalHeight || image.height || 0;
        const nw = ow * SCALE;
        const nh = oh * SCALE;
        return original.call(this, image, dx - (nw - ow) / 2, dy - (nh - oh) / 2, nw, nh);
      }

      if (args.length === 4) {
        const [dx, dy, dw, dh] = args;
        const nw = dw * SCALE;
        const nh = dh * SCALE;
        return original.call(this, image, dx - (nw - dw) / 2, dy - (nh - dh) / 2, nw, nh);
      }

      if (args.length === 8) {
        const [sx, sy, sw, sh, dx, dy, dw, dh] = args;
        const nw = dw * SCALE;
        const nh = dh * SCALE;
        return original.call(this, image, sx, sy, sw, sh,
          dx - (nw - dw) / 2,
          dy - (nh - dh) / 2,
          nw,
          nh
        );
      }

      return original.call(this, image, ...args);
    };
  }

  report();
})();
<\/script>`;

      window.addEventListener('message', event => {
        if (!event.data || event.data.type !== 'senku-bomb-test-hit') return;
        status.textContent = `2× BOMB TEST ACTIVE • HITS ${event.data.hitCount}`;
      });

      fetch('./index.html', { cache: 'no-store' })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.text();
        })
        .then(html => {
          const baseTag = '<base href="./">';
          let patched = html;
          if (patched.includes('<head>')) {
            patched = patched.replace('<head>', '<head>' + baseTag + injectedPatch);
          } else {
            patched = baseTag + injectedPatch + patched;
          }
          frame.srcdoc = patched;
          status.textContent = '2× BOMB TEST ACTIVE • HITS 0';
        })
        .catch(error => {
          console.error(error);
          status.textContent = '2× TEST LOAD ERROR';
        });
    })();
  </script>
</body>
</html>
