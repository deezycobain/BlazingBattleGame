<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Blazing Battle — Dev Playtest</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#game{display:block;width:100%;height:100%;border:0}
#boot{position:fixed;z-index:2147483647;top:8px;right:8px;padding:4px 7px;border-radius:8px;font:700 10px/1.2 system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.7);pointer-events:none;transition:opacity .35s}
</style>
</head>
<body>
<div id="boot">DEV LOADING…</div>
<iframe id="game" src="./index.html?v=dev-playtest-airburst-1" title="Blazing Battle"></iframe>
<script>
(()=>{
  const frame=document.getElementById('game');
  const boot=document.getElementById('boot');
  const BOMB_SCALE=2;
  const JUTSU_PROJECTILE_SIZE=[291,185];
  const JUTSU_IMPACT_SIZE=[396,267];
  let lastAirburst=0;

  const sourceOf=image=>String(image?.currentSrc||image?.src||'');
  const sourceSize=image=>[image?.naturalWidth||image?.videoWidth||image?.width||0,image?.naturalHeight||image?.videoHeight||image?.height||0];
  const matchesSize=(image,size)=>{const [w,h]=sourceSize(image);return w===size[0]&&h===size[1];};

  function looksLikeRevivalFormulaProjectile(image){
    const src=sourceOf(image);
    return !!image&&(src.includes('/jutsu/chemical_reaction/projectile/')||src.includes('/jutsu/revival_formula/projectile/')||matchesSize(image,JUTSU_PROJECTILE_SIZE));
  }
  function looksLikeRevivalFormulaImpact(image){
    const src=sourceOf(image);
    return !!image&&(src.includes('/jutsu/chemical_reaction/impact/')||src.includes('/jutsu/revival_formula/impact/')||matchesSize(image,JUTSU_IMPACT_SIZE));
  }
  function looksLikeSenkuBombForScale(image){
    if(!image||looksLikeRevivalFormulaProjectile(image)||looksLikeRevivalFormulaImpact(image))return false;
    const src=sourceOf(image),[w,h]=sourceSize(image);
    return (src.includes('/senku/')&&src.includes('bomb'))||src.includes('projectile_clean')||(w===96&&h===96);
  }
  function logDev(type,message){try{frame.contentWindow?.__BLAZING_DEV_MONITOR__?.record(type,message);}catch(_){}}

  function ensureAirburstStyle(doc){
    if(doc.getElementById('bb-revival-airburst-style'))return;
    const style=doc.createElement('style');style.id='bb-revival-airburst-style';style.textContent=`
      .bb-revival-bottle{position:fixed;z-index:2147483000;pointer-events:none;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));will-change:transform,opacity}
      .bb-revival-flash{position:fixed;z-index:2147482999;pointer-events:none;width:34px;height:34px;border-radius:50%;transform:translate(-50%,-50%) scale(.25);opacity:0;background:radial-gradient(circle,rgba(222,255,229,.98) 0%,rgba(113,255,146,.9) 18%,rgba(52,220,96,.58) 43%,rgba(40,170,85,.18) 68%,rgba(40,170,85,0) 76%);box-shadow:0 0 28px rgba(80,255,130,.75)}
    `;doc.head.appendChild(style);
  }

  function destinationFromArgs(ctx,args){
    let dx=0,dy=0,dw=40,dh=28;
    if(args.length===2){[dx,dy]=args;}
    else if(args.length===4){[dx,dy,dw,dh]=args;}
    else if(args.length===8){[, , , ,dx,dy,dw,dh]=args;}
    const rect=ctx.canvas.getBoundingClientRect();
    const sx=rect.width/(ctx.canvas.width||rect.width||1),sy=rect.height/(ctx.canvas.height||rect.height||1);
    return {x:rect.left+dx*sx,y:rect.top+dy*sy,w:Math.max(24,Math.min(54,dw*sx)),h:Math.max(18,Math.min(42,dh*sy))};
  }

  function playRevivalAirburst(ctx,image,args){
    const now=performance.now();if(now-lastAirburst<650)return;lastAirburst=now;
    const doc=frame.contentDocument;if(!doc)return;ensureAirburstStyle(doc);
    const p=destinationFromArgs(ctx,args);
    const bottle=doc.createElement('img');bottle.className='bb-revival-bottle';bottle.src=sourceOf(image);bottle.style.width=p.w+'px';bottle.style.height=p.h+'px';bottle.style.left=p.x+'px';bottle.style.top=p.y+'px';doc.body.appendChild(bottle);
    logDev('info','Revival Formula airburst launch');
    const duration=520,rise=150,drift=32,start=performance.now();
    function tick(t){
      const q=Math.min(1,(t-start)/duration);const ease=1-Math.pow(1-q,2);const x=drift*ease;const y=-rise*Math.sin(q*Math.PI*.5);const rot=220*q;
      bottle.style.transform=`translate(${x}px,${y}px) rotate(${rot}deg)`;bottle.style.opacity=String(1-Math.max(0,(q-.82)/.18));
      if(q<1)requestAnimationFrame(tick);else{const r=bottle.getBoundingClientRect();bottle.remove();playGreenFlash(doc,r.left+r.width/2,r.top+r.height/2);}
    }
    requestAnimationFrame(tick);
  }

  function playGreenFlash(doc,x,y){
    const flash=doc.createElement('div');flash.className='bb-revival-flash';flash.style.left=x+'px';flash.style.top=y+'px';doc.body.appendChild(flash);logDev('ok','Revival Formula bottle burst • heal flash');
    const start=performance.now(),duration=430;
    function tick(t){const q=Math.min(1,(t-start)/duration);const scale=.25+3.9*Math.sin(Math.PI*Math.min(1,q));flash.style.transform=`translate(-50%,-50%) scale(${scale})`;flash.style.opacity=String(q<.2?q/.2:1-(q-.2)/.8);if(q<1)requestAnimationFrame(tick);else flash.remove();}
    requestAnimationFrame(tick);
  }

  function drawBombScaled(original,ctx,image,args){
    if(args.length===2){const [dx,dy]=args,[ow,oh]=sourceSize(image),nw=ow*BOMB_SCALE,nh=oh*BOMB_SCALE;return original.call(ctx,image,dx-(nw-ow)/2,dy-(nh-oh)/2,nw,nh);}
    if(args.length===4){const [dx,dy,dw,dh]=args,nw=dw*BOMB_SCALE,nh=dh*BOMB_SCALE;return original.call(ctx,image,dx-(nw-dw)/2,dy-(nh-dh)/2,nw,nh);}
    if(args.length===8){const [sx,sy,sw,sh,dx,dy,dw,dh]=args,nw=dw*BOMB_SCALE,nh=dh*BOMB_SCALE;return original.call(ctx,image,sx,sy,sw,sh,dx-(nw-dw)/2,dy-(nh-dh)/2,nw,nh);}
    return original.call(ctx,image,...args);
  }

  function wrapDrawImage(original){
    if(typeof original!=='function'||original.__senkuAirburstWrapped)return original;
    function patchedDrawImage(image,...args){
      if(looksLikeRevivalFormulaProjectile(image)){playRevivalAirburst(this,image,args);return;}
      if(looksLikeRevivalFormulaImpact(image))return; // suppress legacy clipped ground-impact frames
      if(looksLikeSenkuBombForScale(image))return drawBombScaled(original,this,image,args);
      return original.call(this,image,...args);
    }
    patchedDrawImage.__senkuAirburstWrapped=true;return patchedDrawImage;
  }

  function installBossStyle(doc){
    if(!doc.getElementById('bb-ornate-boss-style')){const style=doc.createElement('style');style.id='bb-ornate-boss-style';style.textContent=`.bb-ornate-boss-hp{position:relative!important;height:18px!important;min-height:18px!important;max-height:18px!important;margin-top:3px!important;overflow:visible!important;border:2px solid #a9772e!important;border-radius:5px!important;background:linear-gradient(180deg,#170708 0%,#090303 55%,#160607 100%)!important;box-shadow:inset 0 0 0 1px #241008,inset 0 2px 4px rgba(255,255,255,.08),0 0 0 1px #050505!important}.bb-ornate-boss-hp::before,.bb-ornate-boss-hp::after{content:'';position:absolute;z-index:8;top:50%;width:9px;height:9px;background:#2a130b;border:1px solid #c19443;transform:translateY(-50%) rotate(45deg);pointer-events:none}.bb-ornate-boss-hp::before{left:-6px}.bb-ornate-boss-hp::after{right:-6px}.bb-ornate-boss-fill{height:10px!important;top:2px!important;bottom:auto!important;border-radius:2px!important;background:linear-gradient(180deg,#ff3b3b 0%,#d51220 46%,#8e0712 100%)!important}.bb-ornate-boss-label{z-index:10!important;color:#f6cf55!important;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000!important;font-size:13px!important}`;doc.head.appendChild(style);}
    const labels=[...doc.querySelectorAll('*')].filter(el=>el.children.length===0&&el.textContent.trim()==='BOSS');labels.forEach(label=>{label.classList.add('bb-ornate-boss-label');let bar=null;for(let el=label.parentElement;el&&el!==doc.body;el=el.parentElement){const r=el.getBoundingClientRect();if(r.width>250&&r.height>=12&&r.height<=55){bar=el;break;}}if(!bar)return;bar.classList.add('bb-ornate-boss-hp');const br=bar.getBoundingClientRect();let fill=null,best=0;[...bar.children].filter(el=>el!==label).forEach(el=>{const r=el.getBoundingClientRect(),score=r.width*r.height;if(r.width>20&&r.height>4&&r.height<=br.height+8&&score>best){best=score;fill=el;}});if(fill)fill.classList.add('bb-ornate-boss-fill');});
  }

  function installDevMonitor(doc){if(doc.getElementById('bb-dev-monitor-loader')||doc.getElementById('bb-dev-monitor'))return;const s=doc.createElement('script');s.id='bb-dev-monitor-loader';s.src='runtime/dev/dev-monitor.js?v=6ca0761';doc.head.appendChild(s);}
  function installSenkuTestOverrides(doc){if(doc.getElementById('bb-senku-test-overrides')||frame.contentWindow?.__SENKU_TEST_OVERRIDES__)return;const s=doc.createElement('script');s.id='bb-senku-test-overrides';s.src='runtime/dev/senku-test-overrides.js?v=0e5841f';doc.head.appendChild(s);}

  function install(){
    try{const win=frame.contentWindow,doc=frame.contentDocument;if(!win||!doc)return;ensureAirburstStyle(doc);if(win.CanvasRenderingContext2D){const proto=win.CanvasRenderingContext2D.prototype;if(!proto.__senkuAirburstPatched){proto.drawImage=wrapDrawImage(proto.drawImage);proto.__senkuAirburstPatched=true;}}doc.querySelectorAll('canvas').forEach(c=>{try{const ctx=c.getContext('2d');if(ctx&&!ctx.__senkuAirburstPatched){ctx.drawImage=wrapDrawImage(ctx.drawImage);ctx.__senkuAirburstPatched=true;}}catch(_){}});installBossStyle(doc);installDevMonitor(doc);installSenkuTestOverrides(doc);boot.textContent='DEV READY • REVIVAL AIRBURST';setTimeout(()=>boot.style.opacity='0',900);}catch(e){boot.textContent='DEV PATCH ACCESS ERROR';boot.style.opacity='1';}
  }
  frame.addEventListener('load',()=>{install();[50,150,300,600,1000,2000,4000].forEach(ms=>setTimeout(install,ms));setInterval(install,1000);});
  setTimeout(()=>{if(boot.textContent==='DEV LOADING…')boot.textContent='DEV GAME LOAD FAILED';},8000);
})();
</script>
</body>
</html>
