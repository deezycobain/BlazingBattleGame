<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Blazing Battle — Dev Runtime</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font:12px system-ui,sans-serif}#status{position:fixed;z-index:2147483647;top:8px;left:8px;padding:5px 8px;border-radius:7px;background:rgba(0,0,0,.78)}</style>
</head>
<body>
<div id="status">DEV RUNTIME PREPARING…</div>
<script>
(async()=>{
  const DEV_PLAYER_SPEED=200;
  const status=document.getElementById('status');
  try{
    const indexRes=await fetch('./runtime/registry/unit-index.json?v=unit-core-v3',{cache:'no-store'});
    if(!indexRes.ok)throw new Error(`unit index ${indexRes.status}`);
    const unitIndex=await indexRes.json();
    const core={};
    for(const entry of unitIndex.units||[]){
      const r=await fetch('./'+entry.path+'?v=unit-core-v3',{cache:'no-store'});
      if(!r.ok)throw new Error(`${entry.id} unit ${r.status}`);
      const u=await r.json();
      const max=u?.combat?.chakra_max,start=u?.combat?.chakra_start;
      if(u.schema_version<3||!Number.isInteger(max)||!Number.isInteger(start)||start<0||start>max)throw new Error(`${entry.id} invalid chakra core`);
      core[u.id]={id:u.id,name:u.display_name,role:u.role,max,start,speed:u.stats?.speed};
    }

    const res=await fetch('./index.html?v=dev-runtime-unit-core-v8',{cache:'no-store'});
    if(!res.ok)throw new Error(`index fetch ${res.status}`);
    let html=await res.text();
    let localizedEdits=0,arrayEdits=0,fillEdits=0,speedEdits=0;

    // Transitional bridge for the monolithic legacy battle. Values come from each unit's
    // canonical unit.json. No global chakra number is authored here.
    for(const unit of Object.values(core)){
      if(unit.role!=='playable')continue;
      const needles=[unit.id,String(unit.name||'').toLowerCase()].filter(Boolean);
      const lower=html.toLowerCase();const spans=[];
      for(const needle of needles){let pos=0;while((pos=lower.indexOf(needle,pos))!==-1){spans.push([Math.max(0,pos-3600),Math.min(html.length,pos+4400)]);pos+=Math.max(1,needle.length);}}
      const merged=[];spans.sort((a,b)=>a[0]-b[0]).forEach(s=>{const last=merged[merged.length-1];if(last&&s[0]<=last[1])last[1]=Math.max(last[1],s[1]);else merged.push(s.slice());});
      for(let i=merged.length-1;i>=0;i--){
        const [a,b]=merged[i];let block=html.slice(a,b);const max=unit.max;
        block=block.replace(/((?:["']?(?:chakra|currentChakra|chakraCurrent|chakraNow|chakra_start|chakraStart|startingChakra|startChakra|chakraPips|chakraOrbs|chakraSegments|energy|currentEnergy|ki|currentKi|charge|charges|chakraMax|maxChakra|chakra_max|max_chakra)["']?)\s*[:=]\s*)(-?\d+(?:\.\d+)?)/gi,(m,p)=>{localizedEdits++;return p+max;});
        block=block.replace(/((?:["']?(?:speed|spd|meterSpeed|turnSpeed|initiativeSpeed|gaugeSpeed|atbSpeed|actionSpeed)["']?)\s*[:=]\s*)(-?\d+(?:\.\d+)?)/gi,(m,p)=>{speedEdits++;return p+DEV_PLAYER_SPEED;});
        block=block.replace(/((?:["']?(?:chakra|chakraPips|chakraOrbs|chakraSegments|currentChakra)["']?)\s*[:=]\s*)\[((?:\s*(?:true|false|0|1)\s*,?){2,})\]/gi,(m,p,items)=>{const boolMode=/true|false/i.test(items);arrayEdits++;return p+'['+Array(max).fill(boolMode?'true':'1').join(',')+']';});
        block=block.replace(/((?:["']?(?:chakra|chakraPips|chakraOrbs|chakraSegments|currentChakra)["']?)\s*[:=]\s*)((?:new\s+)?Array\(\s*\d+\s*\)\.fill\(\s*(false|0)\s*\))/gi,(m,p,expr,seed)=>{fillEdits++;return p+`Array(${max}).fill(${String(seed).toLowerCase()==='false'?'true':'1'})`;});
        html=html.slice(0,a)+block+html.slice(b);
      }
    }

    const payload=JSON.stringify(core).replace(/</g,'\\u003c');
    const marker=`<script>window.BB_UNIT_CORE=Object.freeze(${payload});window.__BB_DEV_PREBOOT__={unitCore:true,localizedEdits:${localizedEdits},arrayEdits:${arrayEdits},fillEdits:${fillEdits},speedEdits:${speedEdits}};<\/script>`;
    const config=`<script>window.BB_DEV_CONFIG=Object.freeze({enabled:true,startPlayableAtMaxChakra:true,playerSpeed:${DEV_PLAYER_SPEED},boostBossSpeed:false});<\/script>`;
    const factory=`<script src="runtime/core/unit-state.js?v=e359099"><\/script>`;
    html=html.replace(/<head([^>]*)>/i,`<head$1>${marker}${config}${factory}`);

    document.open();document.write(html);document.close();
  }catch(err){status.textContent='DEV RUNTIME LOAD FAILED • '+(err?.message||err);console.error(err);}
})();
</script>
</body>
</html>
