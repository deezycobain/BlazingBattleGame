<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Blazing Battle — Dev Runtime</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font:12px system-ui,sans-serif}#status{position:fixed;z-index:2147483647;top:8px;left:8px;padding:5px 8px;border-radius:7px;background:rgba(0,0,0,.78)}</style>
</head>
<body>
<div id="status">DEV RUNTIME PREPARING…</div>
<script>
(async()=>{
  const DEV_SPEED=200;
  const DEV_CHAKRA=8;
  const status=document.getElementById('status');
  try{
    const res=await fetch('./index.html?v=dev-runtime-source-playerboost-4',{cache:'no-store'});
    if(!res.ok) throw new Error(`index fetch ${res.status}`);
    let html=await res.text();
    let speedEdits=0,bossSpeedSkips=0,chakraEdits=0,maxEdits=0,initEdits=0,senkuEdits=0;

    // DEV BASELINE: boost authored PLAYER unit speeds only. Boss/enemy/opponent records stay untouched.
    const speedPattern=/((?:["']?(?:speed|spd|meterSpeed|turnSpeed|initiativeSpeed|gaugeSpeed|atbSpeed|actionSpeed)["']?)\s*[:=]\s*)(-?\d+(?:\.\d+)?)/gi;
    html=html.replace(speedPattern,(match,prefix,value,offset,whole)=>{
      const near=whole.slice(Math.max(0,offset-1400),Math.min(whole.length,offset+1400)).toLowerCase();
      const isBoss=/\bboss\b|\benemy\b|\bopponent\b|anubis|side\s*[:=]\s*["']enemy["']|role\s*[:=]\s*["']boss["']|role\s*[:=]\s*["']enemy["']/.test(near);
      if(isBoss){bossSpeedSkips++;return match;}
      speedEdits++;return prefix+DEV_SPEED;
    });

    // Full chakra for all player-side unit/resource values in dev.
    const currentNames='chakra|currentChakra|chakraCurrent|chakraNow|chakra_start|chakraStart|energy|currentEnergy|ki|currentKi';
    const maxNames='chakraMax|maxChakra|chakra_max|max_chakra|energyMax|maxEnergy|kiMax|maxKi';
    html=html.replace(new RegExp('((?:["\']?(?:'+currentNames+')["\']?)\\s*[:=]\\s*)(-?\\d+(?:\\.\\d+)?)','gi'),(m,p,v,offset,whole)=>{
      const near=whole.slice(Math.max(0,offset-1100),Math.min(whole.length,offset+1100)).toLowerCase();
      if(/\bboss\b|\benemy\b|\bopponent\b|anubis/.test(near)) return m;
      chakraEdits++;return p+DEV_CHAKRA;
    });
    html=html.replace(new RegExp('((?:["\']?(?:'+maxNames+')["\']?)\\s*[:=]\\s*)(-?\\d+(?:\\.\\d+)?)','gi'),(m,p,v,offset,whole)=>{
      const near=whole.slice(Math.max(0,offset-1100),Math.min(whole.length,offset+1100)).toLowerCase();
      if(/\bboss\b|\benemy\b|\bopponent\b|anubis/.test(near)) return m;
      maxEdits++;return p+DEV_CHAKRA;
    });
    html=html.replace(/((?:chakra|currentChakra|chakraCurrent|chakraNow)\s*=\s*)(?:0|null|undefined|[^;\n]+?\?\?\s*0)(?=\s*[;,\n])/gi,(m,p)=>{initEdits++;return p+DEV_CHAKRA;});

    // Senku explicit legacy bridge: canonical unit core is 8/8, and legacy runtime is forced to match it.
    html=html.replace(/((?:senku(?:Current)?Chakra|senku_chakra|senkuChakraCurrent|senkuChakra|senku\.chakra|senku\.currentChakra)\s*[:=]\s*)(-?\d+(?:\.\d+)?)/gi,(m,p)=>{senkuEdits++;return p+DEV_CHAKRA;});

    const marker=`<script>window.__BB_DEV_PREBOOT__={speed:${DEV_SPEED},chakra:${DEV_CHAKRA},speedEdits:${speedEdits},bossSpeedSkips:${bossSpeedSkips},chakraEdits:${chakraEdits},maxEdits:${maxEdits},initEdits:${initEdits},senkuEdits:${senkuEdits}};<\/script>`;
    html=html.replace(/<head([^>]*)>/i,`<head$1>${marker}`);

    const config=`<script>window.BB_DEV_CONFIG=Object.freeze({enabled:true,startFullChakra:true,startingChakra:${DEV_CHAKRA},unitSpeed:${DEV_SPEED},boostBossSpeed:false,senkuStartsMaxChakra:true});<\/script>`;
    html=html.replace(marker,marker+config);

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    status.textContent='DEV RUNTIME LOAD FAILED • '+(err?.message||err);
    console.error(err);
  }
})();
</script>
</body>
</html>
