<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Blazing Battle — Dev Runtime</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font:12px system-ui,sans-serif}#status{position:fixed;z-index:2147483647;top:8px;left:8px;padding:5px 8px;border-radius:7px;background:rgba(0,0,0,.78)}</style>
</head>
<body>
<div id="status">DEV RUNTIME PREPARING…</div>
<script>
(async()=>{
  const DEV_SPEED=200;
  const DEV_CHAKRA=8;
  const status=document.getElementById('status');
  try{
    const res=await fetch('./index.html?v=dev-runtime-source-fullchakra-2',{cache:'no-store'});
    if(!res.ok) throw new Error(`index fetch ${res.status}`);
    let html=await res.text();
    let speedEdits=0,chakraEdits=0,maxEdits=0,initEdits=0;

    // DEV BASELINE: mutate source literals BEFORE any game code executes.
    // Cover object literals and assignment forms used by the legacy standalone runtime.
    html=html.replace(/((?:["']?(?:speed|spd|meterSpeed|turnSpeed|initiativeSpeed|gaugeSpeed|atbSpeed|actionSpeed)["']?)\s*[:=]\s*)(-?\d+(?:\.\d+)?)/gi,(m,p)=>{speedEdits++;return p+DEV_SPEED;});

    const currentNames='chakra|currentChakra|chakraCurrent|chakraNow|energy|currentEnergy|ki|currentKi';
    const maxNames='chakraMax|maxChakra|chakra_max|max_chakra|energyMax|maxEnergy|kiMax|maxKi';
    html=html.replace(new RegExp('((?:["\']?(?:'+currentNames+')["\']?)\\s*[:=]\\s*)(-?\\d+(?:\\.\\d+)?)','gi'),(m,p)=>{chakraEdits++;return p+DEV_CHAKRA;});
    html=html.replace(new RegExp('((?:["\']?(?:'+maxNames+')["\']?)\\s*[:=]\\s*)(-?\\d+(?:\\.\\d+)?)','gi'),(m,p)=>{maxEdits++;return p+DEV_CHAKRA;});

    // Catch common constructor/default patterns where chakra is initialized via fallback expressions.
    html=html.replace(/((?:chakra|currentChakra|chakraCurrent|chakraNow)\s*=\s*)(?:0|null|undefined|[^;\n]+?\?\?\s*0)(?=\s*[;,\n])/gi,(m,p)=>{initEdits++;return p+DEV_CHAKRA;});

    const marker=`<script>window.__BB_DEV_PREBOOT__={speed:${DEV_SPEED},chakra:${DEV_CHAKRA},speedEdits:${speedEdits},chakraEdits:${chakraEdits},maxEdits:${maxEdits},initEdits:${initEdits}};<\/script>`;
    html=html.replace(/<head([^>]*)>/i,`<head$1>${marker}`);

    // Also expose a simple, permanent DEV baseline config for any new runtime code we migrate later.
    const config=`<script>window.BB_DEV_CONFIG=Object.freeze({enabled:true,startFullChakra:true,startingChakra:${DEV_CHAKRA},unitSpeed:${DEV_SPEED}});<\/script>`;
    html=html.replace(marker,marker+config);

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    status.textContent='DEV RUNTIME LOAD FAILED • '+(err?.message||err);
    console.error(err);
  }
})();
</script>
</body>
</html>
