<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Blazing Battle — Dev Runtime</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font:12px system-ui,sans-serif}#status{position:fixed;z-index:2147483647;top:8px;left:8px;padding:5px 8px;border-radius:7px;background:rgba(0,0,0,.78)}</style>
</head>
<body>
<div id="status">DEV RUNTIME PREPARING…</div>
<script>
(async()=>{
  const DEV_SPEED=200;
  const DEV_CHAKRA=8;
  const status=document.getElementById('status');
  try{
    const res=await fetch('./index.html?v=dev-runtime-source-corebridge-6',{cache:'no-store'});
    if(!res.ok) throw new Error(`index fetch ${res.status}`);
    let html=await res.text();
    let chakraEdits=0,maxEdits=0,senkuLocalizedEdits=0,senkuSpeedEdits=0;

    // DEV CHAKRA BASELINE. Cover the common legacy spellings before the game executes.
    const currentNames='chakra|currentChakra|chakraCurrent|chakraNow|chakra_start|chakraStart|startingChakra|startChakra|energy|currentEnergy|ki|currentKi|charge|charges';
    const maxNames='chakraMax|maxChakra|chakra_max|max_chakra|max_chakra_points|energyMax|maxEnergy|kiMax|maxKi|maxCharge|maxCharges';
    html=html.replace(new RegExp('((["\\\']?(?:'+currentNames+')["\\\']?)\\s*[:=]\\s*)(-?\\d+(?:\\.\\d+)?)','gi'),(m,p)=>{chakraEdits++;return p+DEV_CHAKRA;});
    html=html.replace(new RegExp('((["\\\']?(?:'+maxNames+')["\\\']?)\\s*[:=]\\s*)(-?\\d+(?:\\.\\d+)?)','gi'),(m,p)=>{maxEdits++;return p+DEV_CHAKRA;});

    // Senku-specific bridge for the legacy standalone runtime. Canonical unit.json is 8/8,
    // but the old monolithic runtime still carries its own copy of some values.
    // Patch only text regions surrounding Senku so boss speed is never touched here.
    const lower=html.toLowerCase();
    const spans=[]; let pos=0;
    while((pos=lower.indexOf('senku',pos))!==-1){spans.push([Math.max(0,pos-2200),Math.min(html.length,pos+2600)]);pos+=5;}
    const merged=[];
    spans.sort((a,b)=>a[0]-b[0]).forEach(s=>{const last=merged[merged.length-1];if(last&&s[0]<=last[1])last[1]=Math.max(last[1],s[1]);else merged.push(s.slice());});
    for(let i=merged.length-1;i>=0;i--){
      const [a,b]=merged[i]; let block=html.slice(a,b);
      block=block.replace(/((?:["']?(?:chakra|currentChakra|chakraCurrent|chakraNow|chakra_start|chakraStart|startingChakra|startChakra|energy|currentEnergy|ki|currentKi|charge|charges|chakraMax|maxChakra|chakra_max|max_chakra)["']?)\s*[:=]\s*)(-?\d+(?:\.\d+)?)/gi,(m,p)=>{senkuLocalizedEdits++;return p+DEV_CHAKRA;});
      block=block.replace(/((?:["']?(?:speed|spd|meterSpeed|turnSpeed|initiativeSpeed|gaugeSpeed|atbSpeed|actionSpeed)["']?)\s*[:=]\s*)(-?\d+(?:\.\d+)?)/gi,(m,p)=>{senkuSpeedEdits++;return p+DEV_SPEED;});
      html=html.slice(0,a)+block+html.slice(b);
    }

    // Pre-execution dev contract. New resolver-backed code can consume this directly.
    const marker=`<script>window.__BB_DEV_PREBOOT__={chakra:${DEV_CHAKRA},chakraEdits:${chakraEdits},maxEdits:${maxEdits},senkuLocalizedEdits:${senkuLocalizedEdits},senkuSpeedEdits:${senkuSpeedEdits}};<\/script>`;
    const config=`<script>window.BB_DEV_CONFIG=Object.freeze({enabled:true,startFullChakra:true,startingChakra:${DEV_CHAKRA},senkuSpeed:${DEV_SPEED},boostBossSpeed:false,senkuStartsMaxChakra:true});<\/script>`;
    html=html.replace(/<head([^>]*)>/i,`<head$1>${marker}${config}`);

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    status.textContent='DEV RUNTIME LOAD FAILED • '+(err?.message||err);
    console.error(err);
  }
})();
</script>
</body>
</html>
