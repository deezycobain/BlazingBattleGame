<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blazing Battle — Sanctuary: First Bloom</title>
<style>
:root{
 --navy:#061d43;--navy2:#0b3268;--ink:#061329;--red:#9e241b;--red2:#d04726;
 --gold:#d8ad4e;--gold2:#f5d982;--paper:#ead8ae;--paper2:#f6e9c8;--green:#5f9d48;
 --blue:#3fa6dc;--stone:#89909a;--shadow:rgba(0,0,0,.42)
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#031126;color:var(--paper2);font-family:Georgia,'Times New Roman',serif}button{font:inherit}
body{min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 50% 8%,#14508a 0,#092b59 24%,#061d43 53%,#031126 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background:repeating-radial-gradient(circle at 52% 32%,transparent 0 17px,rgba(93,166,223,.6) 18px 20px,transparent 21px 35px)}
.app{position:relative;z-index:1;min-height:100vh;max-width:1180px;margin:auto;padding:max(12px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom))}
.topbar{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap;margin-bottom:10px}.brand,.resources,.panel,.tabs,.action-panel,.garden-frame{border:2px solid var(--gold);box-shadow:0 8px 30px var(--shadow),inset 0 0 0 2px rgba(5,18,43,.85)}
.brand{flex:1 1 300px;padding:11px 18px;background:linear-gradient(120deg,var(--navy),#0b3c79 68%,var(--red));position:relative;overflow:hidden}.brand:after{content:"";position:absolute;right:-30px;top:-55px;width:150px;height:150px;border:17px solid rgba(245,217,130,.09);border-radius:50%}.brand h1{margin:0;font-size:clamp(30px,5vw,58px);letter-spacing:.03em;color:var(--paper2);text-shadow:0 2px #000,2px 0 #000}.brand small{display:block;color:var(--gold2);font-size:15px;letter-spacing:.18em;text-transform:uppercase}
.resources{flex:2 1 470px;background:rgba(4,22,50,.94);display:grid;grid-template-columns:repeat(4,1fr);min-height:76px}.res{display:flex;align-items:center;justify-content:center;gap:8px;border-left:1px solid rgba(216,173,78,.35);padding:8px}.res:first-child{border-left:0}.ico{font-size:25px}.res b{font-size:21px}.res span:last-child{font-size:11px;color:#d6c596;display:block}
.cyclebar{display:flex;gap:10px;align-items:center;margin:0 0 10px}.cycle-title{background:linear-gradient(90deg,var(--red),#c54328);border:2px solid var(--gold);padding:8px 16px;min-width:210px;box-shadow:0 5px 18px var(--shadow)}.cycle-title strong{font-size:24px}.cycle-title small{display:block;color:#f2d99b;letter-spacing:.12em}.back{margin-left:auto;border:1px solid var(--gold);background:#071d3e;color:var(--paper2);padding:9px 13px;cursor:pointer}.back:hover{background:#0c376d}
.garden-frame{position:relative;min-height:52vh;border-radius:3px;overflow:hidden;background:linear-gradient(#98cbea 0 40%,#76984c 40% 48%,#d8c998 49% 100%)}
.sky{position:absolute;inset:0 0 48%;background:radial-gradient(circle at 72% 16%,#fff8d2 0 3%,transparent 4%),linear-gradient(#8ac5ec,#d9edf2 70%,#8aa77c)}.mountains{position:absolute;left:-5%;right:-5%;bottom:0;height:65%;opacity:.55;background:linear-gradient(135deg,transparent 0 13%,#56717c 14% 24%,transparent 25% 32%,#47636d 33% 48%,transparent 49% 55%,#66848a 56% 70%,transparent 71%)}
.veranda{position:absolute;left:0;right:0;bottom:43%;height:7%;background:linear-gradient(#4a2f20,#261a15);box-shadow:0 8px 0 #171111}.sand{position:absolute;left:0;right:0;bottom:0;height:48%;background-color:#dbcda1;transition:background .5s ease}.sand[data-stage="1"]{background-image:repeating-linear-gradient(8deg,transparent 0 13px,rgba(109,94,63,.3) 14px 16px)}.sand[data-stage="2"],.sand[data-stage="3"]{background-image:repeating-radial-gradient(ellipse at 66% 47%,transparent 0 18px,rgba(103,89,60,.34) 19px 22px,transparent 23px 37px)}.sand[data-stage="4"],.sand[data-stage="5"]{background-image:repeating-radial-gradient(ellipse at 52% 44%,transparent 0 16px,rgba(93,78,52,.38) 17px 20px,transparent 21px 34px)}
.sand[data-pattern="still-water"]{background-image:repeating-linear-gradient(3deg,transparent 0 12px,rgba(95,80,53,.38) 13px 15px)}.sand[data-pattern="ripple"]{background-image:repeating-radial-gradient(ellipse at 57% 46%,transparent 0 17px,rgba(95,80,53,.4) 18px 21px,transparent 22px 35px)}.sand[data-pattern="spiral-wind"]{background-image:repeating-radial-gradient(circle at 55% 43%,transparent 0 13px,rgba(95,80,53,.42) 14px 17px,transparent 18px 29px);transform:skewX(-1deg)}
.tree-wrap{position:absolute;left:50%;bottom:19%;width:min(48vw,480px);height:min(43vh,430px);transform:translateX(-50%);filter:drop-shadow(0 16px 10px rgba(0,0,0,.28));transition:.6s ease}.pot{position:absolute;left:27%;right:27%;bottom:0;height:17%;background:linear-gradient(180deg,#17447a,#082756);border:4px solid var(--gold);clip-path:polygon(4% 0,96% 0,88% 82%,75% 100%,25% 100%,12% 82%);box-shadow:inset 0 -11px 0 rgba(0,0,0,.18)}.pot:after{content:"◉";position:absolute;left:50%;top:30%;transform:translateX(-50%);color:var(--gold2);font-size:25px}.trunk{position:absolute;left:47%;bottom:13%;width:11%;height:56%;background:linear-gradient(90deg,#4d2916,#916037 45%,#4b2817);border-radius:60% 34% 25% 20%;transform-origin:bottom;transform:rotate(4deg);box-shadow:inset -6px 0 #32190e;transition:.7s ease}.branch{position:absolute;background:#5a311c;height:6%;border-radius:50%;transform-origin:left center;opacity:0;transition:.6s ease}.b1{left:49%;bottom:52%;width:31%;transform:rotate(-17deg)}.b2{left:47%;bottom:43%;width:30%;transform:rotate(192deg)}.b3{left:50%;bottom:61%;width:24%;transform:rotate(201deg)}.b4{left:50%;bottom:68%;width:25%;transform:rotate(-34deg)}.canopy{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 30%,#8bc65b,#3c7f39 55%,#1d542e);box-shadow:inset 0 -8px rgba(6,63,37,.25);opacity:0;transform:scale(.3);transition:.65s ease}.c1{width:26%;height:17%;left:57%;bottom:57%}.c2{width:29%;height:18%;left:25%;bottom:48%}.c3{width:25%;height:16%;left:30%;bottom:65%}.c4{width:26%;height:17%;left:53%;bottom:72%}.c5{width:22%;height:14%;left:41%;bottom:80%}.sprout{position:absolute;left:48%;bottom:14%;width:4%;height:35%;background:#627a35;border-radius:70%;transform-origin:bottom}.sprout:before,.sprout:after{content:"";position:absolute;width:190%;height:24%;background:#6ba74b;border-radius:100% 0 100% 0;top:15%}.sprout:before{right:40%;transform:rotate(25deg)}.sprout:after{left:40%;transform:scaleX(-1) rotate(25deg)}
.tree-wrap[data-stage="0"] .pot{left:38%;right:38%;height:12%}.tree-wrap[data-stage="0"] .trunk,.tree-wrap[data-stage="0"] .branch,.tree-wrap[data-stage="0"] .canopy{display:none}
.tree-wrap[data-stage="1"] .sprout{height:42%;width:5%}.tree-wrap[data-stage="1"] .trunk,.tree-wrap[data-stage="1"] .branch{display:none}.tree-wrap[data-stage="1"] .c2{opacity:1;transform:scale(.48);left:36%;bottom:47%}
.tree-wrap[data-stage="2"] .sprout{display:none}.tree-wrap[data-stage="2"] .trunk{height:47%;width:7%}.tree-wrap[data-stage="2"] .b1,.tree-wrap[data-stage="2"] .b2{opacity:1}.tree-wrap[data-stage="2"] .c1,.tree-wrap[data-stage="2"] .c2,.tree-wrap[data-stage="2"] .c3{opacity:1;transform:scale(.73)}
.tree-wrap[data-stage="3"] .sprout,.tree-wrap[data-stage="4"] .sprout,.tree-wrap[data-stage="5"] .sprout{display:none}.tree-wrap[data-stage="3"] .branch,.tree-wrap[data-stage="4"] .branch,.tree-wrap[data-stage="5"] .branch{opacity:1}.tree-wrap[data-stage="3"] .canopy{opacity:1;transform:scale(.86)}.tree-wrap[data-stage="4"] .canopy,.tree-wrap[data-stage="5"] .canopy{opacity:1;transform:scale(1)}
.tree-wrap[data-stage="4"] .trunk,.tree-wrap[data-stage="5"] .trunk{height:61%;width:12%}.tree-wrap[data-shape="windswept"]{transform:translateX(-50%) skewX(-7deg)}.tree-wrap[data-shape="ascending"]{transform:translateX(-50%) scaleY(1.07)}
.blossoms{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s}.tree-wrap[data-stage="5"] .blossoms{opacity:1}.blossoms i{position:absolute;width:15px;height:15px;border-radius:50%;background:#f6b7c8;box-shadow:11px 2px #ffd2de,-6px 8px #f3aabd,4px -8px #ffe0e8}.blossoms i:nth-child(1){left:29%;top:23%}.blossoms i:nth-child(2){left:61%;top:17%}.blossoms i:nth-child(3){left:72%;top:36%}.blossoms i:nth-child(4){left:39%;top:34%}.blossoms i:nth-child(5){left:50%;top:7%}
.stones{position:absolute;inset:0;pointer-events:none}.rock{position:absolute;width:8%;height:10%;bottom:20%;background:linear-gradient(145deg,#9ea6a6,#59636a);clip-path:polygon(30% 0,74% 13%,100% 69%,76% 100%,8% 91%,0 48%);filter:drop-shadow(0 8px 5px rgba(0,0,0,.22));opacity:.15;transition:.5s}.sand[data-stage="2"]~.stones .rock,.sand[data-stage="3"]~.stones .rock,.sand[data-stage="4"]~.stones .rock,.sand[data-stage="5"]~.stones .rock{opacity:1}.r1{left:69%}.r2{left:78%;bottom:31%;transform:scale(.72)}.r3{left:18%;bottom:25%;transform:scale(.56)}.stones[data-layout="centered"] .r1{left:64%}.stones[data-layout="riverbank"] .r1{left:74%}.stones[data-layout="riverbank"] .r2{left:82%}.stones[data-layout="riverbank"] .r3{left:70%}.stones[data-layout="mountain"] .r1{left:71%;transform:scale(1.25)}.stones[data-layout="mountain"] .r2{left:81%;transform:scale(.62)}
.petals{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:0}.garden-frame.complete .petals,.tree-wrap[data-stage="5"]~.petals{opacity:1}.petals b{position:absolute;top:-8%;width:9px;height:14px;background:#f6afc2;border-radius:70% 20% 70% 20%;animation:fall linear infinite}.petals b:nth-child(1){left:10%;animation-duration:8s}.petals b:nth-child(2){left:28%;animation-duration:10s;animation-delay:-4s}.petals b:nth-child(3){left:62%;animation-duration:7s;animation-delay:-3s}.petals b:nth-child(4){left:78%;animation-duration:11s;animation-delay:-6s}.petals b:nth-child(5){left:91%;animation-duration:9s;animation-delay:-2s}@keyframes fall{to{transform:translate(70px,65vh) rotate(510deg)}}
.hud{position:absolute;left:12px;bottom:12px;width:min(390px,calc(100% - 24px));background:rgba(3,18,42,.9);border:1px solid var(--gold);padding:10px;backdrop-filter:blur(4px)}.meter-row{display:grid;grid-template-columns:118px 1fr 45px;align-items:center;gap:8px;margin:6px 0}.meter{height:12px;border-radius:8px;background:#17233a;border:1px solid #c59e4a;overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5e9c45,#a6cd65);transition:width .45s}.meter.blue i{background:linear-gradient(90deg,#2c77aa,#4bb9df)}
.tabs{margin-top:10px;background:#051a3b;padding:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.tab{background:linear-gradient(var(--paper2),var(--paper));color:#302419;border:2px solid var(--gold);padding:12px 6px;font-weight:bold;cursor:pointer}.tab.active{background:linear-gradient(#b83a29,#7e1918);color:#fff3ce}.tab:disabled{filter:grayscale(1);opacity:.45;cursor:not-allowed}
.action-panel{margin-top:10px;background:linear-gradient(135deg,rgba(248,235,199,.98),rgba(223,196,140,.98));color:#231b13;padding:14px;min-height:150px}.action-panel h2{margin:0 0 5px;color:#0a2d5e}.action-panel p{margin:4px 0 12px}.actions{display:flex;flex-wrap:wrap;gap:8px}.action{border:2px solid #8e5d21;background:linear-gradient(#fff0c9,#dfbd78);color:#291b0f;padding:10px 14px;cursor:pointer;font-weight:bold;box-shadow:0 3px 0 #80511f}.action.primary{background:linear-gradient(#c33b28,#8f1f1c);color:#fff1c7;border-color:#e1b34f}.action:disabled{opacity:.45;filter:grayscale(.8);cursor:not-allowed}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.choice{border:2px solid #b08736;background:#f4e3ba;padding:9px;cursor:pointer}.choice.selected{outline:3px solid #b32621;background:#fff0c8}.notice{margin-top:10px;padding:8px 10px;background:#0a2f61;color:#f4dfaa;border-left:4px solid var(--gold)}
.dev{margin-top:8px;text-align:right}.dev button{background:transparent;color:#ceb777;border:1px dashed #806c3c;padding:5px 8px;cursor:pointer;font-size:12px}
@media(max-width:720px){.resources{grid-template-columns:repeat(2,1fr)}.res:nth-child(3){border-left:0;border-top:1px solid rgba(216,173,78,.35)}.res:nth-child(4){border-top:1px solid rgba(216,173,78,.35)}.garden-frame{min-height:54vh}.tree-wrap{width:78vw;height:39vh;bottom:19%}.tabs{grid-template-columns:repeat(5,1fr);gap:3px}.tab{font-size:12px;padding:10px 2px}.hud{font-size:13px}.meter-row{grid-template-columns:100px 1fr 38px}.choices{grid-template-columns:1fr}.brand h1{font-size:38px}}
</style>
</head>
<body>
<main class="app">
 <header class="topbar">
  <section class="brand"><small>Blazing Battle</small><h1>SANCTUARY</h1></section>
  <section class="resources" aria-label="Sanctuary resources">
   <div class="res"><span class="ico">🌿</span><div><b id="leafCount">0</b><span>LEAF ESSENCE</span></div></div>
   <div class="res"><span class="ico">🪨</span><div><b id="stoneCount">0</b><span>GARDEN STONE</span></div></div>
   <div class="res"><span class="ico">💧</span><div><b id="waterCount">0</b><span>SPIRIT WATER</span></div></div>
   <div class="res"><span class="ico">◉</span><div><b id="sealCount">0</b><span>HARMONY SEAL</span></div></div>
  </section>
 </header>
 <div class="cyclebar"><div class="cycle-title"><strong>First Bloom</strong><small>Cultivation I</small></div><button class="back" onclick="location.href='index.html'">← Home</button></div>
 <section class="garden-frame" id="gardenFrame">
  <div class="sky"><div class="mountains"></div></div><div class="veranda"></div>
  <div class="sand" id="sand"></div>
  <div class="stones" id="stones"><i class="rock r1"></i><i class="rock r2"></i><i class="rock r3"></i></div>
  <div class="tree-wrap" id="tree">
   <div class="pot"></div><div class="sprout"></div><div class="trunk"></div>
   <i class="branch b1"></i><i class="branch b2"></i><i class="branch b3"></i><i class="branch b4"></i>
   <i class="canopy c1"></i><i class="canopy c2"></i><i class="canopy c3"></i><i class="canopy c4"></i><i class="canopy c5"></i>
   <div class="blossoms"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="petals"><b></b><b></b><b></b><b></b><b></b></div>
  <div class="hud">
   <div class="meter-row"><strong>Tree Growth</strong><div class="meter"><i id="treeMeter"></i></div><b id="treePct">0%</b></div>
   <div class="meter-row"><strong>Garden Harmony</strong><div class="meter blue"><i id="gardenMeter"></i></div><b id="gardenPct">0%</b></div>
   <div id="stageLine">Stage: Seedling · Garden: Untouched</div>
  </div>
 </section>
 <nav class="tabs" aria-label="Sanctuary sections">
  <button class="tab active" data-tab="cultivate">Cultivate</button><button class="tab" data-tab="design">Design</button><button class="tab" data-tab="grove">Grove</button><button class="tab" data-tab="records">Records</button><button class="tab" data-tab="summon">Summon</button>
 </nav>
 <section class="action-panel" id="actionPanel"></section>
 <div class="dev"><button id="resetDev">Reset Sanctuary Dev State</button></div>
</main>
<script>
(()=>{
 const KEY='bb:sanctuary:v1';
 const TREE=['Seedling','New Growth','Young Bonsai','Shaped Bonsai','Mature Bonsai','First Bloom'];
 const GARDEN=['Untouched','First Lines','Flow','Balance','Harmony','First Bloom Garden'];
 const defaults=()=>({version:1,cycle:'first-bloom',leafEssence:240,gardenStone:160,spiritWater:18,harmonySeals:0,treeStage:0,treeProgress:0,gardenStage:0,gardenProgress:0,treeShape:null,sandPattern:null,stoneLayout:null,completed:[],claimed:false});
 function load(){try{return Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return defaults()}}
 let S=load(),tab='cultivate';
 const $=id=>document.getElementById(id);const q=s=>document.querySelector(s);const qa=s=>[...document.querySelectorAll(s)];
 function save(){localStorage.setItem(KEY,JSON.stringify(S))}
 function totalPct(stage,progress){return Math.min(100,Math.round(((stage+(stage===5?1:progress/100))/6)*100))}
 function advance(kind,amount){const stKey=kind+'Stage',pKey=kind+'Progress';if(S[stKey]>=5){S[pKey]=100;return}S[pKey]+=amount;while(S[pKey]>=100&&S[stKey]<5){S[pKey]-=100;S[stKey]++;flash(kind==='tree'?'The bonsai has grown into '+TREE[S.treeStage]+'.':'The garden has reached '+GARDEN[S.gardenStage]+'.')}if(S[stKey]===5)S[pKey]=100}
 let note='';function flash(t){note=t;setTimeout(()=>{note='';render()},1800)}
 function spend(key,cost){if(S[key]<cost){flash('Not enough '+({leafEssence:'Leaf Essence',gardenStone:'Garden Stone',spiritWater:'Spirit Water'}[key]||key)+'.');return false}S[key]-=cost;return true}
 function completeReady(){return S.treeStage===5&&S.gardenStage===5&&!S.claimed}
 function renderScene(){
  $('leafCount').textContent=S.leafEssence;$('stoneCount').textContent=S.gardenStone;$('waterCount').textContent=S.spiritWater;$('sealCount').textContent=S.harmonySeals;
  $('tree').dataset.stage=S.treeStage;$('tree').dataset.shape=S.treeShape||'';$('sand').dataset.stage=S.gardenStage;$('sand').dataset.pattern=S.sandPattern||'';$('stones').dataset.layout=S.stoneLayout||'';
  const tp=totalPct(S.treeStage,S.treeProgress),gp=totalPct(S.gardenStage,S.gardenProgress);$('treeMeter').style.width=tp+'%';$('gardenMeter').style.width=gp+'%';$('treePct').textContent=tp+'%';$('gardenPct').textContent=gp+'%';$('stageLine').textContent='Stage: '+TREE[S.treeStage]+' · Garden: '+GARDEN[S.gardenStage];$('gardenFrame').classList.toggle('complete',S.claimed)
 }
 function choiceGroup(title,key,opts){return `<h3>${title}</h3><div class="choices">${opts.map(([v,n,d])=>`<button class="choice ${S[key]===v?'selected':''}" data-choice="${key}:${v}"><strong>${n}</strong><br><small>${d}</small></button>`).join('')}</div>`}
 function cultivate(){return `<h2>Cultivate · ${TREE[S.treeStage]}</h2><p>Nurture the bonsai and watch First Bloom physically change at every stage.</p><div class="actions"><button class="action primary" data-act="nourish" ${S.treeStage===5?'disabled':''}>Nourish · 12 🌿</button><button class="action" data-act="water" ${S.treeStage===5?'disabled':''}>Spirit Water · 1 💧</button></div>${S.treeStage>=3?choiceGroup('Pruning Form','treeShape',[['balanced','Balanced','Rounded, composed canopy'],['windswept','Wind Swept','Branches pulled with the wind'],['ascending','Ascending','Taller, upward silhouette']]):'<div class="notice">Pruning choices unlock at Shaped Bonsai.</div>'}`}
 function design(){return `<h2>Design · ${GARDEN[S.gardenStage]}</h2><p>Shape the karesansui independently from the tree. Sand, stones, and the finished composition remain separate visual layers.</p><div class="actions"><button class="action primary" data-act="rake" ${S.gardenStage===5?'disabled':''}>Rake · 10 🪨</button><button class="action" data-act="refine" ${S.gardenStage===5?'disabled':''}>Refine · 1 💧</button></div>${S.gardenStage>=2?choiceGroup('Sand Pattern','sandPattern',[['still-water','Still Water','Long parallel current'],['ripple','Ripple','Concentric rings around stone'],['spiral-wind','Spiral Wind','Circular flowing motion']]):'<div class="notice">Sand pattern choices unlock at Flow.</div>'}${S.gardenStage>=3?choiceGroup('Stone Layout','stoneLayout',[['centered','Centered','Balanced focal stones'],['riverbank','Riverbank','Asymmetric edge cluster'],['mountain','Mountain','Dominant vertical stone']]):''}`}
 function grove(){const items=S.completed.length?S.completed.map((x,i)=>`<div class="notice"><strong>First Bloom #${String(i+1).padStart(3,'0')}</strong> · ${x.treeShape||'Natural'} · ${x.sandPattern||'Natural sand'} · ${x.stoneLayout||'Natural stones'}<br><small>${new Date(x.completedAt).toLocaleString()}</small></div>`).join(''):'<div class="notice">Your Grove is empty. Complete First Bloom and the finished cultivation will live here permanently.</div>';return `<h2>The Grove</h2><p>Completed cultivations are preserved, not erased.</p>${items}`}
 function records(){return `<h2>Garden Records</h2><p>Cultivations completed: <strong>${S.completed.length}</strong> · Harmony Seals earned: <strong>${S.harmonySeals+S.completed.length}</strong></p>${choiceGroup('First Bloom Discoveries','treeShape',[['balanced','Balanced',S.completed.some(x=>x.treeShape==='balanced')?'Discovered':'Undiscovered'],['windswept','Wind Swept',S.completed.some(x=>x.treeShape==='windswept')?'Discovered':'Undiscovered'],['ascending','Ascending',S.completed.some(x=>x.treeShape==='ascending')?'Discovered':'Undiscovered']])}`}
 function summon(){return `<h2>Sanctuary Summon</h2><p>Harmony Seals: <strong>${S.harmonySeals}</strong></p><div class="actions"><button class="action primary" data-act="summon" ${S.harmonySeals<1?'disabled':''}>Use Harmony Seal · 1 ◉</button></div><div class="notice">Prototype reward only: this verifies the currency loop. Final Sanctuary summon pool and cinematic come later.</div>`}
 function completion(){if(!completeReady())return '';return `<div class="notice"><strong>FIRST BLOOM IS READY.</strong> The tree and garden have both reached completion.</div><div class="actions" style="margin-top:8px"><button class="action primary" data-act="complete">Complete First Bloom · Earn Harmony Seal</button></div>`}
 function render(){renderScene();qa('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let body={cultivate,design,grove,records,summon}[tab]();$('actionPanel').innerHTML=body+completion()+(note?`<div class="notice">${note}</div>`:'');bind()}
 function bind(){
  qa('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==='nourish'&&spend('leafEssence',12))advance('tree',34);if(a==='water'&&spend('spiritWater',1))advance('tree',22);if(a==='rake'&&spend('gardenStone',10))advance('garden',34);if(a==='refine'&&spend('spiritWater',1))advance('garden',22);if(a==='complete'&&completeReady()){S.completed.push({cycle:'first-bloom',treeShape:S.treeShape||'balanced',sandPattern:S.sandPattern||'ripple',stoneLayout:S.stoneLayout||'centered',completedAt:new Date().toISOString()});S.harmonySeals++;S.claimed=true;flash('First Bloom complete. Harmony Seal acquired.')}if(a==='summon'&&S.harmonySeals>0){S.harmonySeals--;flash('Sanctuary Summon consumed one Harmony Seal. Reward pool comes next.')}save();render()});
  qa('[data-choice]').forEach(b=>b.onclick=()=>{const [k,v]=b.dataset.choice.split(':');S[k]=v;save();render()})
 }
 qa('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('resetDev').onclick=()=>{if(confirm('Reset Sanctuary prototype progress?')){S=defaults();save();tab='cultivate';render()}};render();
})();
</script>
