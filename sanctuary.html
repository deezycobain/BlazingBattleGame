<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <title>Blazing Battle — Sanctuary: First Bloom</title>
 <link rel="stylesheet" href="runtime/ui/sanctuary/first-bloom.css">
</head>
<body>
 <main id="sanctuaryApp" class="sanctuary-app">
  <header class="sanctuary-topbar">
   <div class="sanctuary-title"><small>BLAZING BATTLE</small><strong>SANCTUARY</strong><span>FIRST BLOOM · CULTIVATION <b id="cultivationNumber">1</b></span></div>
   <div class="sanctuary-resources" aria-label="Sanctuary resources">
    <div><i>葉</i><span><b id="leafCount">0</b><small>LEAF ESSENCE</small></span></div>
    <div><i>石</i><span><b id="stoneCount">0</b><small>GARDEN STONE</small></span></div>
    <div><i>水</i><span><b id="waterCount">0</b><small>SPIRIT WATER</small></span></div>
    <div><i>和</i><span><b id="sealCount">0</b><small>HARMONY SEAL</small></span></div>
   </div>
   <div class="sanctuary-top-actions"><button id="homeButton" class="quiet-button" type="button">← HOME</button><button id="devOpen" class="dev-button" type="button" aria-controls="devPanel" aria-expanded="false">DEV</button></div>
  </header>
  <section id="gardenScene" class="garden-scene" aria-label="First Bloom garden">
   <div class="environment" aria-hidden="true"><div class="sun"></div><div class="mountains"></div><div class="veranda"></div></div>
   <div class="garden-stack" aria-label="Layered karesansui garden">
    <img id="sandBase" class="garden-layer sand-base" src="assets/ui/sanctuary/first-bloom/sand/base/sand_bed_base.png" alt="">
    <img id="rakeLayer" class="garden-layer" alt=""><img id="motifLayer" class="garden-layer motif-layer" alt="">
    <img id="nameTemplateLayer" class="garden-layer name-template-layer" alt=""><div id="gardenSignature" class="garden-signature" aria-label="Player garden signature"></div>
    <img id="mossLayer" class="garden-layer accent-layer" src="assets/ui/sanctuary/first-bloom/sand/accents/moss_edge.png" alt="">
    <img id="petalLayer" class="garden-layer accent-layer" src="assets/ui/sanctuary/first-bloom/sand/accents/petal_scatter.png" alt=""><img id="stoneLayer" class="garden-layer stones-layer" alt="">
   </div>
   <div class="bonsai-stack" aria-label="Layered First Bloom bonsai">
    <img id="potLayer" class="bonsai-layer pot-layer" src="assets/ui/sanctuary/first-bloom/bonsai/pot/pot_base.png" alt="Bonsai pot">
    <img id="rootLayer" class="bonsai-layer root-layer" alt="Root and soil state"><img id="trunkLayer" class="bonsai-layer trunk-layer" alt="Bonsai trunk stage">
    <img id="canopyLayer" class="bonsai-layer canopy-layer" alt="Bonsai canopy"><img id="blossomLayer" class="bonsai-layer blossom-layer" alt="Bonsai blossoms">
    <img id="fxDrift" class="bonsai-layer fx-layer fx-drift" alt=""><img id="fxRing" class="bonsai-layer fx-layer fx-ring" alt=""><img id="fxBurst" class="bonsai-layer fx-layer fx-burst" alt=""><img id="fxGround" class="bonsai-layer fx-layer fx-ground" alt="">
   </div>
   <div class="scene-status">
    <div><span><b id="treeStageLabel">Seedling</b><small>TREE · <em id="treePercent">0%</em></small></span><div class="meter"><i id="treeMeter"></i></div></div>
    <div><span><b id="gardenStageLabel">Untouched Garden</b><small>HARMONY · <em id="gardenPercent">0%</em></small></span><div class="meter garden-meter"><i id="gardenMeter"></i></div></div>
   </div>
   <div id="ceremony" class="ceremony" hidden aria-live="assertive"><small>CULTIVATION COMPLETE</small><strong>FIRST BLOOM</strong><span>HARMONY SEAL ACQUIRED</span></div>
  </section>
  <nav class="sanctuary-tabs" aria-label="Sanctuary sections"><button class="tab active" type="button" data-tab="cultivate">CULTIVATE</button><button class="tab" type="button" data-tab="garden">GARDEN</button><button class="tab" type="button" data-tab="grove">GROVE</button><button class="tab" type="button" data-tab="summon">SUMMON</button></nav>
  <section id="actionPanel" class="action-panel" aria-live="polite"></section><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
 </main>
 <div id="devBackdrop" class="dev-backdrop" hidden></div>
 <aside id="devPanel" class="dev-panel" aria-label="Sanctuary Test Panel" aria-hidden="true"><header><div><small>SANCTUARY</small><strong>TEST PANEL</strong></div><button id="devClose" type="button" aria-label="Close developer panel">×</button></header><div id="devStatus" class="dev-status"></div><div id="devControls" class="dev-controls"></div></aside>
 <script src="runtime/ui/sanctuary/first-bloom.js"></script>
</body>
</html>
